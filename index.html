    <script>
        // --- MEGA BANCO DE PREGUNTAS (Nivel Examen UNAM/IPN) ---
        const examQuestions = [
            // MATEMÁTICAS (15)
            {s:'matematicas', q:"Calcula el límite: lim(x→0) sen(3x) / x", o:["0", "1", "3", "Indeterminado"], c:2, e:"Usando el límite notable lim(x→0) sen(kx)/x = k. Aquí k=3, por lo tanto el límite es 3."},
            {s:'matematicas', q:"¿Cuál es la derivada de f(x) = ln(x² + 1)?", o:["2x / (x² + 1)", "1 / (x² + 1)", "2x", "x / (x² + 1)"], c:0, e:"Por la regla de la cadena: d/dx[ln(u)] = u'/u. Aquí u = x²+1, entonces u' = 2x. El resultado es 2x/(x²+1)."},
            {s:'matematicas', q:"Evalúa la integral indefinida ∫(2x + e^x) dx", o:["x² + e^x + C", "2 + e^x + C", "x² + xe^x + C", "x² - e^x + C"], c:0, e:"La integral de 2x es x². La integral de e^x es e^x. Se suma la constante de integración C."},
            {s:'matematicas', q:"Coordenadas del centro de la circunferencia x² + y² - 6x + 4y - 12 = 0", o:["(-3, 2)", "(3, -2)", "(6, -4)", "(-6, 4)"], c:1, e:"Dividiendo los coeficientes de x e y entre -2. Centro (h,k) = (-D/2, -E/2) = (-(-6)/2, -(4)/2) = (3, -2)."},
            {s:'matematicas', q:"Simplifica: (x³ - 8) / (x - 2)", o:["x² - 4", "x² + 2x + 4", "x² - 2x + 4", "x² + 4"], c:1, e:"Diferencia de cubos: a³-b³ = (a-b)(a²+ab+b²). x³-8 = (x-2)(x²+2x+4). Al dividir, se cancela (x-2)."},
            {s:'matematicas', q:"Si f(x) = x² y g(x) = 2x-1, ¿cuál es f(g(x))?", o:["2x² - 1", "4x² - 4x + 1", "4x² - 1", "2x³ - x²"], c:1, e:"Sustituye g(x) dentro de f: (2x-1)². Expandiendo el binomio: 4x² - 4x + 1."},
            {s:'matematicas', q:"Dominio de la función f(x) = log(x - 3)", o:["x ≥ 3", "x > 0", "x < 3", "x > 3"], c:3, e:"El argumento del logaritmo debe ser estrictamente positivo. x - 3 > 0, por lo que x > 3."},
            {s:'matematicas', q:"Solución del sistema: 3x - y = 7 y 2x + 3y = 12", o:["x=3, y=2", "x=2, y=-1", "x=4, y=5", "x=1, y=-4"], c:0, e:"Multiplica la 1ra por 3: 9x-3y=21. Sumando con la 2da: 11x = 33 -> x=3. Sustituyendo en la 1ra: 3(3)-y=7 -> y=2."},
            {s:'matematicas', q:"Si el discriminante (b² - 4ac) de una ecuación cuadrática es menor a 0:", o:["Tiene dos raíces reales iguales", "Tiene dos raíces reales diferentes", "No tiene raíces reales", "Es una recta"], c:2, e:"Si el discriminante es negativo, la ecuación arroja raíces imaginarias/complejas (no reales)."},
            {s:'matematicas', q:"Pendiente de la recta perpendicular a y = (2/3)x - 5", o:["2/3", "-2/3", "3/2", "-3/2"], c:3, e:"Dos rectas son perpendiculares si el producto de sus pendientes es -1 (son inversas y de signo contrario). Inverso de 2/3 es -3/2."},
            {s:'matematicas', q:"La expresión sen²(x) + cos²(x) equivale a:", o:["1", "tg(x)", "0", "sec²(x)"], c:0, e:"Identidad pitagórica fundamental de la trigonometría."},
            {s:'matematicas', q:"¿Cuál es la distancia entre los puntos A(-2, 3) y B(1, -1)?", o:["4", "5", "7", "25"], c:1, e:"Fórmula de distancia: d = √[(1 - (-2))² + (-1 - 3)²] = √[3² + (-4)²] = √[9 + 16] = √25 = 5."},
            {s:'matematicas', q:"Resuelve la desigualdad: |2x - 1| < 5", o:["-3 < x < 3", "-2 < x < 3", "x < 3", "x > -2"], c:1, e:"Propiedad del valor absoluto: -5 < 2x - 1 < 5. Sumas 1 a todo: -4 < 2x < 6. Divides entre 2: -2 < x < 3."},
            {s:'matematicas', q:"Una matriz A tiene dimensión 2x3 y B es 3x4. ¿Dimensión de A*B?", o:["2x4", "3x3", "No se puede multiplicar", "2x3"], c:0, e:"Los números internos coinciden (3 y 3). La matriz resultante hereda las filas de A y columnas de B (2x4)."},
            {s:'matematicas', q:"Probabilidad de obtener al menos un águila al lanzar 2 monedas:", o:["1/4", "1/2", "3/4", "1"], c:2, e:"Espacio muestral: AA, AS, SA, SS. En tres casos hay al menos un águila (AA, AS, SA). Prob. = 3/4."},
            {s:'matematicas', q:"Calcula: 5 + 3 × 2", o:["16", "11", "20", "10"], c:1, e:"Por jerarquía de operaciones, primero se multiplica (3 × 2 = 6) y luego se suma (5 + 6 = 11)."},
            {s:'matematicas', q:"Resuelve para x: 3x - 7 = 14", o:["7", "21", "10", "4"], c:0, e:"Pasas el 7 sumando: 3x = 21. Divides entre 3: x = 7."},
            {s:'matematicas', q:"Convierte 0.75 a fracción irreducible:", o:["3/4", "75/100", "1/4", "4/3"], c:0, e:"0.75 equivale a 75/100. Dividiendo ambos entre 25, obtenemos 3/4."},
            {s:'matematicas', q:"¿Cuál es el área de un triángulo de base 6m y altura 4m?", o:["24 m²", "10 m²", "12 m²", "20 m²"], c:2, e:"La fórmula es (base × altura) / 2. (6 × 4) / 2 = 24 / 2 = 12 m²."},
            {s:'matematicas', q:"Simplifica: (x³)²", o:["x⁵", "x⁶", "x⁹", "x"], c:1, e:"Al elevar una potencia a otra potencia, los exponentes se multiplican: 3 × 2 = 6."},

            // FÍSICA (15)
            {s:'fisica', q:"Si la distancia entre dos masas se reduce a la mitad, la fuerza gravitacional entre ellas:", o:["Se reduce a la mitad", "Se duplica", "Se cuadruplica", "No cambia"], c:2, e:"Fórmula: F = G(m1m2)/r². Si 'r' se divide entre 2, su cuadrado divide entre 4. Por ley de sándwich, la fuerza se multiplica por 4."},
            {s:'fisica', q:"Unidad de la potencia eléctrica en el Sistema Internacional:", o:["Voltio", "Amperio", "Joule", "Watt"], c:3, e:"La potencia (rapidez con la que se transfiere energía) se mide en Joules/segundo, que equivale a Watts."},
            {s:'fisica', q:"La energía cinética de un cuerpo depende directamente de:", o:["Su masa y su altura", "Su masa y el cuadrado de su velocidad", "Su peso y su aceleración", "Su densidad y volumen"], c:1, e:"Fórmula de la energía cinética: Ec = (1/2) * m * v². Depende de la masa y el cuadrado de la velocidad."},
            {s:'fisica', q:"En un proceso isotérmico de un gas ideal, ¿qué variable se mantiene constante?", o:["Presión", "Volumen", "Calor", "Temperatura"], c:3, e:"El prefijo 'iso' significa igual, y 'térmico' se refiere a temperatura. T = constante."},
            {s:'fisica', q:"Principio que explica por qué los aviones pueden volar (sustentación):", o:["Principio de Arquímedes", "Principio de Bernoulli", "Ley de Pascal", "Efecto Doppler"], c:1, e:"El Principio de Bernoulli establece que a mayor velocidad de un fluido (aire), menor presión. La diferencia de presión eleva al avión."},
            {s:'fisica', q:"Para que exista transferencia de calor entre dos cuerpos, es condición necesaria y suficiente que:", o:["Tengan diferente masa", "Tengan diferente temperatura", "Estén en estado líquido", "Tengan diferente calor específico"], c:1, e:"El calor es energía en tránsito que fluye exclusivamente debido a una diferencia de temperatura."},
            {s:'fisica', q:"Un objeto se suelta desde el reposo. ¿Qué distancia cae en los primeros 3 segundos? (g = 10 m/s²)", o:["15 m", "30 m", "45 m", "90 m"], c:2, e:"Fórmula de caída libre: d = (1/2)gt². d = (0.5)(10)(3²) = 5 * 9 = 45 metros."},
            {s:'fisica', q:"La luz tiene naturaleza dual, comportándose como:", o:["Masa y volumen", "Onda y partícula", "Calor y sonido", "Aceleración y velocidad"], c:1, e:"Según la física cuántica, la luz exhibe características de ondas (interferencia) y partículas (fotones)."},
            {s:'fisica', q:"Es la resistencia que oponen los materiales al flujo de corriente eléctrica:", o:["Voltaje", "Resistencia", "Capacitancia", "Inductancia"], c:1, e:"La resistencia eléctrica se mide en Ohms y limita el paso de los electrones."},
            {s:'fisica', q:"Según la Tercera Ley de Newton, las fuerzas de acción y reacción:", o:["Se cancelan mutuamente", "Actúan sobre el mismo cuerpo", "Actúan sobre cuerpos diferentes", "Tienen diferente magnitud"], c:2, e:"Actúan sobre objetos distintos (A empuja a B, B empuja a A), por lo tanto NO se anulan entre sí."},
            {s:'fisica', q:"Magnitud vectorial que mide la variación de la velocidad respecto al tiempo:", o:["Fuerza", "Rapidez", "Desplazamiento", "Aceleración"], c:3, e:"La aceleración (a = Δv/Δt) indica qué tan rápido cambia la velocidad."},
            {s:'fisica', q:"Si tres resistencias de 6 Ohms se conectan en paralelo, la resistencia total es:", o:["18 Ohms", "2 Ohms", "6 Ohms", "1/2 Ohms"], c:1, e:"En paralelo para resistencias iguales: R_eq = R / n = 6 / 3 = 2 Ohms."},
            {s:'fisica', q:"Fuerza de empuje que recibe un cuerpo sumergido es igual al peso del fluido desplazado:", o:["Arquímedes", "Pascal", "Newton", "Boyle"], c:0, e:"Es el enunciado exacto del Principio de Arquímedes (flotabilidad)."},
            {s:'fisica', q:"Cambio aparente en la frecuencia de una onda debido al movimiento relativo entre la fuente y el observador:", o:["Efecto Compton", "Efecto Fotoeléctrico", "Efecto Doppler", "Difracción"], c:2, e:"El Efecto Doppler explica por qué la sirena de una ambulancia cambia de tono al acercarse y alejarse."},
            {s:'fisica', q:"¿A cuántos grados Kelvin equivalen 20 °C?", o:["253.15 K", "273.15 K", "293.15 K", "313.15 K"], c:2, e:"Fórmula: K = °C + 273.15. Por lo tanto, 20 + 273.15 = 293.15 K."},

            // QUÍMICA (15)
            {s:'quimica', q:"Partícula subatómica responsable de la formación de enlaces químicos:", o:["Neutrón", "Protón", "Positrón", "Electrón de valencia"], c:3, e:"Los electrones de la capa más externa (valencia) son los que se comparten o ceden para formar enlaces."},
            {s:'quimica', q:"Número cuántico principal 'n' determina:", o:["La forma del orbital", "El nivel de energía y tamaño", "La orientación espacial", "El espín del electrón"], c:1, e:"El número 'n' (1, 2, 3...) indica el nivel energético y la distancia promedio del núcleo (tamaño)."},
            {s:'quimica', q:"¿Cuántos moles hay en 36 gramos de agua (H₂O)?", o:["1 mol", "2 moles", "3 moles", "0.5 moles"], c:1, e:"Masa molar H₂O = (2x1) + 16 = 18 g/mol. Moles = Masa / Masa molar = 36 / 18 = 2 moles."},
            {s:'quimica', q:"En una reacción REDOX, el agente oxidante es la especie química que:", o:["Cede protones", "Se oxida", "Gana electrones (se reduce)", "Pierde electrones"], c:2, e:"El agente oxidante provoca la oxidación de otro, y al hacerlo, él mismo acepta esos electrones (se reduce)."},
            {s:'quimica', q:"Según Brønsted-Lowry, una base es una sustancia capaz de:", o:["Aceptar protones (H+)", "Donar protones (H+)", "Donar electrones", "Liberar iones OH-"], c:0, e:"Brønsted-Lowry define ácidos como donadores de protones (H+) y bases como aceptores de protones."},
            {s:'quimica', q:"Reacción que libera calor hacia su entorno:", o:["Endotérmica", "Exotérmica", "Catabólica", "Isotérmica"], c:1, e:"Exo (fuera) + térmica (calor). Ejemplo: la combustión."},
            {s:'quimica', q:"Configuración electrónica correcta del Carbono (Z=6):", o:["1s² 2s² 2p¹", "1s² 2s² 2p²", "1s² 2p⁴", "1s² 2s² 2p⁶"], c:1, e:"Se acomodan 6 electrones: 2 en el 1s, 2 en el 2s, y quedan 2 para el orbital 2p."},
            {s:'quimica', q:"El enlace peptídico es característico en la estructura de:", o:["Carbohidratos", "Lípidos", "Ácidos nucleicos", "Proteínas"], c:3, e:"Une aminoácidos para formar polipéptidos y proteínas."},
            {s:'quimica', q:"Principio que establece que si se aplica estrés a un sistema en equilibrio, este se desplaza para contrarrestarlo:", o:["Ley de Hess", "Ley de Lavoisier", "Principio de Le Chatelier", "Ley de Avogadro"], c:2, e:"El principio de Le Chatelier dicta cómo los sistemas químicos reaccionan a cambios de concentración, presión o temperatura."},
            {s:'quimica', q:"Fórmula general de los alcanos:", o:["CnH2n", "CnH2n-2", "CnH2n+2", "CnHn"], c:2, e:"Son hidrocarburos saturados. Por cada carbono, hay el doble de hidrógenos más dos (CnH2n+2)."},
            {s:'quimica', q:"Elemento más electronegativo de la tabla periódica:", o:["Oxígeno", "Cloro", "Flúor", "Nitrógeno"], c:2, e:"El Flúor (arriba a la derecha, sin contar gases nobles) tiene la mayor capacidad para atraer electrones."},
            {s:'quimica', q:"pH de una solución cuya concentración de iones [H+] es 1 x 10⁻⁴ M:", o:["10", "4", "-4", "14"], c:1, e:"Fórmula: pH = -log[H+]. pH = -log(10⁻⁴) = 4."},
            {s:'quimica', q:"Gas responsable del efecto invernadero y producto de la combustión completa:", o:["Monóxido de carbono (CO)", "Dióxido de carbono (CO₂)", "Ozono (O₃)", "Clorofluorocarbono"], c:1, e:"El CO₂ se libera al quemar hidrocarburos y atrapa calor en la atmósfera."},
            {s:'quimica', q:"¿Qué tipo de enlace se presenta en la molécula de O₂?", o:["Iónico", "Covalente polar", "Covalente no polar", "Puente de hidrógeno"], c:2, e:"Al unirse dos átomos del mismo elemento, la diferencia de electronegatividad es 0, los electrones se comparten equitativamente (no polar)."},
            {s:'quimica', q:"Isótopos son átomos del mismo elemento que difieren en el número de:", o:["Protones", "Electrones", "Neutrones", "Niveles de energía"], c:2, e:"Tienen el mismo número atómico (protones) pero diferente masa debido a una cantidad variable de neutrones."},

            // BIOLOGÍA (15)
            {s:'biologia', q:"Proceso metabólico mediante el cual se degrada la glucosa hasta piruvato generando 2 ATP netos:", o:["Ciclo de Krebs", "Glucólisis", "Cadena respiratoria", "Fermentación"], c:1, e:"La glucólisis ocurre en el citoplasma y es el primer paso tanto en respiración aerobia como anaerobia."},
            {s:'biologia', q:"En el dogma central de la biología, la transcripción consiste en:", o:["Copiar ADN a ADN", "Traducir ARN a Proteína", "Crear ARNm a partir de un molde de ADN", "Replicar ribosomas"], c:2, e:"Transcripción es 'reescribir' el código genético del ADN a ARN mensajero (ARNm) para que pueda salir del núcleo."},
            {s:'biologia', q:"Tipo de transporte celular que requiere gasto de energía (ATP):", o:["Ósmosis", "Difusión facilitada", "Transporte activo", "Difusión simple"], c:2, e:"El transporte activo mueve sustancias en contra del gradiente de concentración, por lo que necesita invertir ATP (ej. Bomba de Sodio-Potasio)."},
            {s:'biologia', q:"Postulado de Darwin y Wallace sobre la evolución:", o:["Uso y desuso de órganos", "Herencia de caracteres adquiridos", "Selección natural", "Generación espontánea"], c:2, e:"Establece que los individuos mejor adaptados a su entorno tienen más probabilidades de sobrevivir y reproducirse."},
            {s:'biologia', q:"La fase luminosa de la fotosíntesis ocurre en:", o:["Estroma del cloroplasto", "Matriz mitocondrial", "Membrana celular", "Tilacoides del cloroplasto"], c:3, e:"En los tilacoides están los pigmentos fotosintéticos (clorofila) que captan la luz para generar ATP y NADPH."},
            {s:'biologia', q:"Cruza un chícharo homocigoto dominante (AA) con un homocigoto recesivo (aa). Genotipo de la F1:", o:["100% Aa", "50% AA, 50% aa", "100% AA", "75% Aa, 25% aa"], c:0, e:"La primera generación (F1) hereda un alelo dominante 'A' y uno recesivo 'a', resultando en descendencia 100% heterocigota (Aa)."},
            {s:'biologia', q:"Base nitrogenada presente en el ARN pero ausente en el ADN:", o:["Timina", "Guanina", "Citosina", "Uracilo"], c:3, e:"En el ARN, el Uracilo (U) reemplaza a la Timina (T) uniéndose con la Adenina (A)."},
            {s:'biologia', q:"La mitosis produce ___ células hijas con ___ de cromosomas que la célula madre.", o:["4, la mitad", "2, el mismo número", "2, el doble", "4, el mismo número"], c:1, e:"Mitosis es división de células somáticas. Genera 2 células idénticas (diploides, igual número cromosómico)."},
            {s:'biologia', q:"Relación simbiótica donde un organismo se beneficia y el otro no se afecta ni beneficia:", o:["Parasitismo", "Mutualismo", "Comensalismo", "Depredación"], c:2, e:"En el comensalismo, uno gana y al otro le da igual (ej. las rémoras nadando junto al tiburón)."},
            {s:'biologia', q:"El reino que agrupa organismos procariotas (como las bacterias) es:", o:["Fungi", "Protista", "Monera", "Plantae"], c:2, e:"El Reino Monera es el único constituido exclusivamente por organismos procariotas unicelulares (sin núcleo verdadero)."},
            {s:'biologia', q:"¿Cuál es la función principal de los ribosomas?", o:["Almacenar ADN", "Digestión celular", "Síntesis de proteínas", "Producción de lípidos"], c:2, e:"Los ribosomas 'leen' el ARN mensajero y ensamblan aminoácidos para sintetizar proteínas."},
            {s:'biologia', q:"Etapa de la respiración aerobia que produce la mayor cantidad de ATP:", o:["Glucólisis", "Ciclo de Krebs", "Fase oscura", "Cadena transportadora de electrones"], c:3, e:"La cadena transportadora de electrones (junto con la quimiósmosis) genera aproximadamente 32-34 ATP por molécula de glucosa."},
            {s:'biologia', q:"Mecanismo de especiación que ocurre por aislamiento geográfico:", o:["Especiación simpátrica", "Especiación alopátrica", "Selección artificial", "Deriva génica"], c:1, e:"'Alos' significa 'otro' y 'patria' lugar. Una barrera física separa la población y evolucionan distinto."},
            {s:'biologia', q:"Organismo autotrófo base de la cadena alimenticia en ecosistemas terrestres:", o:["Consumidores primarios", "Descomponedores", "Productores", "Depredadores tope"], c:2, e:"Las plantas y otros autotrófos fotosintéticos producen la materia orgánica inicial de la red trófica."},

        // --- ESTADO DE LA APP ---
        let userQuestions = [];
        let activeQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let currentSubject = '';

        const subjectsInfo = {
            'matematicas': { title: 'Matemáticas', colorClass: 'tile-matematicas', icon: '📐' },
            'fisica': { title: 'Física', colorClass: 'tile-fisica', icon: '⚛️' },
            'quimica': { title: 'Química', colorClass: 'tile-quimica', icon: '🧪' },
            'biologia': { title: 'Biología', colorClass: 'tile-biologia', icon: '🧬' },
            'historia': { title: 'Historia', colorClass: 'tile-historia', icon: '🏛️' },
            'escrita': { title: 'Español (Escrita)', colorClass: 'tile-escrita', icon: '✍️' },
            'lectura': { title: 'Lectura/Lit.', colorClass: 'tile-lectura', icon: '📖' }
        };

        const appContainer = document.getElementById('app-container');
        const scoreDisplay = document.getElementById('score-display');
        const navQuiz = document.getElementById('nav-quiz');
        const navStats = document.getElementById('nav-stats');

        // --- INICIALIZACIÓN ---
        function initApp() {
            const saved = localStorage.getItem('lockin_user_qs');
            if (saved) {
                userQuestions = JSON.parse(saved);
            }
            goHome(); 
        }

        // --- NAVEGACIÓN ---
        function setActiveNav(tab) {
            navQuiz.classList.remove('text-rose-600');
            navStats.classList.remove('text-rose-600');
            if(tab === 'quiz') navQuiz.classList.add('text-rose-600');
            if(tab === 'stats') navStats.classList.add('text-rose-600');
        }

        function goHome() {
            setActiveNav('quiz');
            scoreDisplay.classList.add('hidden');
            
            // Unimos las preguntas base y las del usuario para contar el total real
            let allQ = [...examQuestions, ...userQuestions];
            
            let html = `
                <div class="px-4 py-6 animate-pop">
                    <h2 class="text-3xl font-black mb-1">Simulador IPN/UNAM</h2>
                    <p class="text-slate-500 mb-6 font-semibold">Selecciona el módulo a entrenar:</p>
                    <div class="grid grid-cols-2 gap-4">
            `;

            for (const [key, info] of Object.entries(subjectsInfo)) {
                // Contar reactivos disponibles por materia
                let qCount = allQ.filter(q => q.s === key).length;
                
                html += `
                    <div onclick="startQuiz('${key}')" class="rounded-3xl p-5 shadow-lg text-white cursor-pointer transform transition active:scale-95 ${info.colorClass}">
                        <div class="text-4xl mb-3">${info.icon}</div>
                        <h3 class="font-bold text-lg leading-tight tracking-wide">${info.title}</h3>
                        <p class="text-xs opacity-90 mt-1 font-semibold">${qCount} Reactivos</p>
                    </div>
                `;
            }

            // Botón Agregar Pregunta
            html += `
                    <div onclick="renderAddQuestion()" class="rounded-3xl p-5 shadow-sm text-slate-600 bg-slate-200 cursor-pointer transform transition active:scale-95 flex flex-col justify-center items-center border-2 border-dashed border-slate-400 hover:bg-slate-300">
                        <div class="text-3xl mb-2">➕</div>
                        <h3 class="font-bold text-sm leading-tight text-center">Añadir<br>Pregunta</h3>
                    </div>
            `;

            html += `</div></div>`;
            appContainer.innerHTML = html;
        }

        // --- SISTEMA DE ESTADÍSTICAS ---
        function saveSessionStat(subject, score, total) {
            let history = JSON.parse(localStorage.getItem('lockin_stats')) || [];
            history.push({
                subject: subject,
                score: score,
                total: total,
                date: new Date().toISOString()
            });
            localStorage.setItem('lockin_stats', JSON.stringify(history));
        }

        function renderStats() {
            setActiveNav('stats');
            scoreDisplay.classList.add('hidden');
            let history = JSON.parse(localStorage.getItem('lockin_stats')) || [];
            
            let html = `
                <div class="px-4 py-6 animate-pop">
                    <h2 class="text-3xl font-black mb-1">Tu Progreso 📈</h2>
                    <p class="text-slate-500 mb-6 font-semibold">Efectividad general acumulada por materia.</p>
                    <div class="space-y-4">
            `;

            if(history.length === 0) {
                html += `<div class="bg-white p-8 rounded-3xl text-center shadow-sm border border-slate-200">
                            <span class="text-5xl block mb-4">🤷‍♂️</span>
                            <p class="text-slate-500 font-bold text-lg">Aún no has completado ninguna prueba.</p>
                            <p class="text-slate-400 text-sm mt-2">Ve a la pestaña Quiz y ponte a prueba.</p>
                         </div>`;
            } else {
                for (const [key, info] of Object.entries(subjectsInfo)) {
                    // Filtrar historial de esta materia
                    let subHistory = history.filter(h => h.subject === key);
                    if(subHistory.length === 0) continue;

                    let totalQuestions = 0;
                    let totalCorrect = 0;
                    subHistory.forEach(s => {
                        totalQuestions += s.total;
                        totalCorrect += s.score;
                    });
                    
                    let percentage = Math.round((totalCorrect / totalQuestions) * 100);
                    let barColor = percentage >= 80 ? 'bg-emerald-500' : (percentage >= 60 ? 'bg-amber-400' : 'bg-rose-500');

                    html += `
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                            <div class="flex justify-between items-center mb-3">
                                <span class="font-bold text-slate-700 flex items-center space-x-2 text-lg">
                                    <span>${info.icon}</span> <span>${info.title}</span>
                                </span>
                                <span class="font-black text-xl ${percentage >= 80 ? 'text-emerald-600' : 'text-slate-700'}">${percentage}%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-4">
                                <div class="${barColor} h-4 rounded-full transition-all duration-1000" style="width: ${percentage}%"></div>
                            </div>
                            <p class="text-[11px] font-bold text-slate-400 mt-3 uppercase tracking-wide">
                                ${totalCorrect} aciertos de ${totalQuestions} respondidas.
                            </p>
                        </div>
                    `;
                }
            }

            html += `
                    <button onclick="clearStats()" class="mt-8 w-full py-4 font-bold text-rose-500 bg-rose-50 rounded-2xl hover:bg-rose-100 transition shadow-sm border border-rose-100">
                        🗑️ Borrar todo mi progreso
                    </button>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function clearStats() {
            if(confirm("¿Estás seguro de que quieres borrar todo tu historial de progreso? Esto no se puede deshacer.")) {
                localStorage.removeItem('lockin_stats');
                renderStats();
            }
        }

        // --- MOTOR DEL QUIZ ---
        function startQuiz(subject) {
            currentSubject = subject;
            
            // Unir preguntas por defecto y las del usuario
            let allQ = [...examQuestions, ...userQuestions];
            
            // Filtrar y mezclar
            let rawQuestions = allQ.filter(q => q.s === subject);
            
            if (rawQuestions.length === 0) {
                alert("No hay preguntas en esta materia. ¡Añade algunas primero!");
                return;
            }
            
            activeQuestions = rawQuestions.sort(() => Math.random() - 0.5);
            
            currentQuestionIndex = 0;
            score = 0;
            
            scoreDisplay.classList.remove('hidden');
            scoreDisplay.innerHTML = `⭐ 0 / ${activeQuestions.length}`;
            
            renderQuestion();
        }

        function renderQuestion() {
            const qData = activeQuestions[currentQuestionIndex];
            const info = subjectsInfo[currentSubject];
            
            let html = `
                <div class="px-4 py-4 animate-pop flex flex-col h-full min-h-screen">
                    <div class="mb-4 flex items-center space-x-2">
                        <span class="text-2xl">${info.icon}</span>
                        <span class="font-bold text-slate-500 uppercase tracking-widest text-xs">${info.title} - PREGUNTA ${currentQuestionIndex + 1} DE ${activeQuestions.length}</span>
                    </div>
                    
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6 flex-grow flex items-center justify-center">
                        <h2 class="text-xl sm:text-2xl font-extrabold text-center text-slate-800 leading-snug">${qData.q}</h2>
                    </div>

                    <div class="grid grid-cols-1 gap-3 mb-6" id="options-container">
            `;

            // Mantener las opciones estáticas para evitar desajustes
            qData.o.forEach((opt, index) => {
                html += `
                    <button onclick="checkAnswer(${index})" class="btn-option w-full bg-white border-2 border-slate-200 text-slate-700 font-bold py-4 px-5 rounded-2xl text-left text-base shadow-sm hover:border-slate-300">
                        ${opt}
                    </button>
                `;
            });

            html += `
                    </div>
                    <div id="feedback-container" class="hidden flex-col items-center justify-center p-6 rounded-3xl text-center mb-8 shadow-inner">
                        <p id="feedback-msg" class="font-black text-2xl mb-2"></p>
                        <p id="feedback-exp" class="text-sm font-semibold opacity-95 leading-relaxed"></p>
                        <button onclick="nextQuestion()" class="mt-6 w-full max-w-[200px] bg-white text-slate-900 font-black py-4 px-8 rounded-2xl shadow-lg active:scale-95 transition">
                            SIGUIENTE ➔
                        </button>
                    </div>
                </div>
            `;
            
            appContainer.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function checkAnswer(selectedIndex) {
            const qData = activeQuestions[currentQuestionIndex];
            const options = document.getElementById('options-container').children;
            const feedbackContainer = document.getElementById('feedback-container');
            const feedbackMsg = document.getElementById('feedback-msg');
            const feedbackExp = document.getElementById('feedback-exp');
            
            // Bloquear clics dobles
            for(let i=0; i<options.length; i++) {
                options[i].disabled = true;
                options[i].classList.add('opacity-40');
            }

            options[qData.c].classList.remove('opacity-40', 'bg-white', 'border-slate-200');
            options[qData.c].classList.add('correct-answer');

            if (selectedIndex === qData.c) {
                score++;
                scoreDisplay.innerHTML = `⭐ ${score} / ${activeQuestions.length}`;
                feedbackContainer.classList.add('bg-emerald-500', 'text-white', 'animate-pop');
                feedbackContainer.classList.remove('hidden');
                feedbackMsg.innerText = "¡CORRECTO! 🔥";
            } else {
                options[selectedIndex].classList.remove('opacity-40', 'bg-white', 'border-slate-200');
                options[selectedIndex].classList.add('wrong-answer');
                feedbackContainer.classList.add('bg-rose-500', 'text-white', 'animate-pop');
                feedbackContainer.classList.remove('hidden');
                feedbackMsg.innerText = "INCORRECTO 💔";
            }
            
            feedbackExp.innerText = qData.e;
            
            // Hacer scroll hacia el feedback para que se vea completo en pantallas chicas
            setTimeout(() => {
                feedbackContainer.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 100);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) {
                renderQuestion();
            } else {
                // Guardar estadísticas al terminar
                saveSessionStat(currentSubject, score, activeQuestions.length);
                renderResults();
            }
        }

        function renderResults() {
            scoreDisplay.classList.add('hidden');
            const percentage = Math.round((score / activeQuestions.length) * 100);
            
            let msgTitle, msgSub, bgClass, txtClass;
            
            if(percentage >= 80) {
                msgTitle = "¡NIVEL UNAM/IPN! 🚀";
                msgSub = "Estás listo para asegurar tu lugar. Brutal.";
                bgClass = "bg-emerald-100 border-emerald-200";
                txtClass = "text-emerald-600";
            } else if (percentage >= 60) {
                msgTitle = "¡BUEN TRABAJO! 📚";
                msgSub = "Andas cerca del puntaje de corte. Afina los detalles.";
                bgClass = "bg-amber-100 border-amber-200";
                txtClass = "text-amber-600";
            } else {
                msgTitle = "MODO LOCK IN REQUERIDO 🔒";
                msgSub = "No te rindas. Usa las explicaciones para aprender de los errores.";
                bgClass = "bg-rose-100 border-rose-200";
                txtClass = "text-rose-600";
            }
            
            let html = `
                <div class="px-4 py-8 flex flex-col items-center justify-center text-center animate-pop h-full min-h-[80vh]">
                    <div class="text-7xl mb-4">🏆</div>
                    <h2 class="text-3xl font-black mb-2 text-slate-800">${msgTitle}</h2>
                    <p class="text-slate-500 font-bold text-sm mb-8 px-4">${msgSub}</p>
                    
                    <div class="${bgClass} border-2 rounded-3xl p-8 mb-10 w-full max-w-xs shadow-sm">
                        <p class="${txtClass} font-bold uppercase tracking-widest text-xs mb-1">Tu Resultado</p>
                        <p class="text-7xl font-black ${txtClass}">${score}</p>
                        <p class="${txtClass} font-bold text-sm mt-1">de ${activeQuestions.length} correctas</p>
                        
                        <div class="mt-6 pt-4 border-t-2 border-white/50">
                            <p class="${txtClass} font-black text-2xl">${percentage}% de efectividad</p>
                        </div>
                    </div>

                    <div class="w-full max-w-xs space-y-3">
                        <button onclick="renderStats()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-4 px-6 rounded-2xl text-lg shadow-xl active:scale-95 transition">
                            Ver Estadísticas 📈
                        </button>
                    </div>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        // --- CREADOR DE PREGUNTAS ---
        function renderAddQuestion() {
            scoreDisplay.classList.add('hidden');
            let subjOptions = '';
            for (const [key, info] of Object.entries(subjectsInfo)) {
                subjOptions += `<option value="${key}">${info.title}</option>`;
            }

            let html = `
                <div class="px-4 py-6 animate-pop pb-24">
                    <div class="flex items-center mb-6">
                        <button onclick="goHome()" class="mr-4 text-slate-400 hover:text-slate-600">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <h2 class="text-2xl font-black text-slate-800">Crear Pregunta</h2>
                    </div>

                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                        <div>
                            <label class="block font-bold text-slate-600 text-sm mb-1">Materia</label>
                            <select id="new-subj" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 font-semibold text-slate-700 outline-none focus:border-rose-500 transition">
                                ${subjOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-600 text-sm mb-1">Pregunta (Examen)</label>
                            <textarea id="new-q" rows="2" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 font-semibold text-slate-700 outline-none focus:border-rose-500 transition" placeholder="Ej: ¿Cuál es la derivada de sen(x)?"></textarea>
                        </div>
                        
                        <!-- Opciones -->
                        <div class="space-y-3 pt-2">
                            <label class="block font-bold text-slate-600 text-sm">Opciones (Marca la correcta)</label>
                            
                            <div class="flex items-center space-x-3">
                                <input type="radio" name="correct-opt" value="0" checked class="w-5 h-5 text-rose-600 accent-rose-600">
                                <input id="opt-0" type="text" class="flex-grow bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold outline-none focus:border-rose-500 transition" placeholder="Opción A (Correcta por defecto)">
                            </div>
                            <div class="flex items-center space-x-3">
                                <input type="radio" name="correct-opt" value="1" class="w-5 h-5 text-rose-600 accent-rose-600">
                                <input id="opt-1" type="text" class="flex-grow bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold outline-none focus:border-rose-500 transition" placeholder="Opción B">
                            </div>
                            <div class="flex items-center space-x-3">
                                <input type="radio" name="correct-opt" value="2" class="w-5 h-5 text-rose-600 accent-rose-600">
                                <input id="opt-2" type="text" class="flex-grow bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold outline-none focus:border-rose-500 transition" placeholder="Opción C">
                            </div>
                            <div class="flex items-center space-x-3">
                                <input type="radio" name="correct-opt" value="3" class="w-5 h-5 text-rose-600 accent-rose-600">
                                <input id="opt-3" type="text" class="flex-grow bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold outline-none focus:border-rose-500 transition" placeholder="Opción D">
                            </div>
                        </div>

                        <div>
                            <label class="block font-bold text-slate-600 text-sm mb-1 mt-4">Explicación (Feedback)</label>
                            <input id="new-exp" type="text" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-emerald-500 transition" placeholder="Ej: La regla de derivación indica que...">
                        </div>
                    </div>

                    <button onclick="saveQuestion()" class="mt-6 w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-4 px-6 rounded-2xl text-lg shadow-xl active:scale-95 transition">
                        Guardar Pregunta
                    </button>
                </div>
            `;
            appContainer.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function saveQuestion() {
            const subj = document.getElementById('new-subj').value;
            const q = document.getElementById('new-q').value.trim();
            const opt0 = document.getElementById('opt-0').value.trim();
            const opt1 = document.getElementById('opt-1').value.trim();
            const opt2 = document.getElementById('opt-2').value.trim();
            const opt3 = document.getElementById('opt-3').value.trim();
            const exp = document.getElementById('new-exp').value.trim() || "Pregunta personalizada agregada por ti.";
            const correctRadio = document.querySelector('input[name="correct-opt"]:checked');

            if (!q || !opt0 || !opt1 || !opt2 || !opt3) {
                alert("Completa la pregunta y las 4 opciones.");
                return;
            }

            const newQ = {
                s: subj,
                q: q,
                o: [opt0, opt1, opt2, opt3],
                c: parseInt(correctRadio.value),
                e: exp
            };

            userQuestions.push(newQ);
            localStorage.setItem('lockin_user_qs', JSON.stringify(userQuestions));
            
            alert("¡Pregunta guardada con éxito!");
            goHome();
        }

        // Iniciar
        window.onload = initApp;
    </script>
</body>
</html>
