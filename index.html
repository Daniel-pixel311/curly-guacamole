    <script>
        // --- SISTEMA DE MODALES (Para Evitar Bloqueos en iOS/PWA) ---
        function showModal(title, message, type = 'alert', onConfirm = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = message;
            
            let btnHtml = '';
            if (type === 'alert') {
                btnHtml = `<button onclick="closeModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition active:scale-95">Entendido</button>`;
            } else if (type === 'confirm') {
                btnHtml = `
                    <button onclick="closeModal()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition active:scale-95">Cancelar</button>
                    <button id="btn-modal-confirm" class="w-1/2 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition active:scale-95">Sí, borrar</button>
                `;
            }
            
            document.getElementById('modal-buttons').innerHTML = btnHtml;
            document.getElementById('custom-modal').classList.remove('hidden');

            if (type === 'confirm' && onConfirm) {
                document.getElementById('btn-modal-confirm').onclick = () => {
                    onConfirm();
                    closeModal();
                };
            }
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        // --- MEGA BANCO DE PREGUNTAS (Nivel Examen UNAM/IPN) ---

            // MATEMÁTICAS 
            {s:'matematicas', q:"¿Cuál es el número que se encuentra en la sexta posición de la sucesión: $\\frac{5}{2}, \\frac{1}{2}, -\\frac{3}{2}, -\\frac{7}{2}, ...$?", o:["$-\\frac{15}{2}$", "$-\\frac{11}{2}$", "$\\frac{11}{2}$", "$-\\frac{9}{2}$"], c:0, e:"La diferencia de la progresión es -2. Restando -2 repetidamente llegamos a -15/2 en la sexta posición."},
            {s:'matematicas', q:"Descomponer en factores la expresión: $6ac + 2ad - 3bc - bd$", o:["$(2a-b)(3c+d)$", "$(2a+b)(3c+d)$", "$(2a-b)(3c-d)$", "$(2a+b)(3c-d)$"], c:0, e:"Agrupando: $2a(3c+d) - b(3c+d)$. Factorizando el término común resulta en $(2a-b)(3c+d)$."},
            {s:'matematicas', q:"Identificar el sistema de ecuaciones lineales que tiene por solución $y=-1, x=3$", o:["$4x+2y=10 \\quad ; \\quad 2x+4y=2$", "$-2x+4y=10 \\quad ; \\quad 4x-2y=2$", "$4x+2y=2 \\quad ; \\quad 4x-2y=10$", "$4x-2y=2 \\quad ; \\quad 2x+4y=10$"], c:0, e:"Sustituyendo en la opción A: $4(3)+2(-1) = 12-2=10$ y $2(3)+4(-1) = 6-4=2$. Ambas se cumplen."},
            {s:'matematicas', q:"Determinar el intervalo solución de la desigualdad: $-3 < \\frac{4x-7}{6} < 9$", o:["$(-\\frac{11}{3},\\frac{61}{3})$", "$(-\\frac{11}{4},\\frac{61}{4})$", "$(-\\frac{13}{3},\\frac{61}{3})$", "$(-\\frac{13}{4},\\frac{61}{4})$"], c:1, e:"Multiplicamos por 6: $-18 < 4x-7 < 54$. Sumamos 7: $-11 < 4x < 61$. Dividimos entre 4: $-11/4 < x < 61/4$."},
            {s:'matematicas', q:"Las calificaciones de Biología son: 6.0, 7.0, 8.0, 7.0, 6.0, 8.0, 4.0, 7.0, 6.0, 7.0. ¿Cuál es la moda?", o:["6.5", "7.0", "6.0", "7.5"], c:1, e:"La moda es el valor que más se repite. El 7.0 aparece 4 veces, más que cualquier otro número."},

            {s:'matematicas', q:"Determinar el valor de la integral definida: $\\int_{1}^{3}(x^3 - 2x)dx$", o:["20", "28", "36", "12"], c:3, e:"Antiderivada: $\\frac{x^4}{4} - x^2$. Evaluada en 3 da $45/4$. Evaluada en 1 da $-3/4$. Su diferencia es $48/4 = 12$."},
            {s:'matematicas', q:"El producto de $(\\frac{7p}{9}-1)$ por $(\\frac{9p}{14}+2)$ es igual a:", o:["$\\frac{p^2}{2}+\\frac{32}{63}p-2$", "$\\frac{p^2}{2}-\\frac{115}{126}p-2$", "$\\frac{p^2}{2}+\\frac{115}{126}p-2$", "$\\frac{p^2}{3}-\\frac{32}{63}p-2$"], c:2, e:"Multiplicando término a término y simplificando las fracciones se obtiene el trinomio indicado."},
            {s:'matematicas', q:"Simplificar la expresión matemática: $(x+4)(x^2+4x+16) - (x-4)(x^2-4x+16)$", o:["$16x^2$", "$8x^2-128$", "128", "$16x^2+128$"], c:3, e:"Al desarrollar ambos productos y restar el segundo del primero, los términos cúbicos se cancelan, resultando en $16x^2+128$."},
            {s:'matematicas', q:"Calcular el valor del límite: $\\lim_{x\\rightarrow0}\\frac{x}{\\sin 4x}$", o:["16", "$\\frac{1}{16}$", "$\\frac{1}{4}$", "4"], c:2, e:"Usando el límite notable $\\lim_{x\\rightarrow0} \\frac{x}{\\sin(kx)} = \\frac{1}{k}$. En este caso $k=4$, por lo que es $1/4$."},
            {s:'matematicas', q:"Dentro de 8 años, la edad de Jonathan será el doble de la de Alfredo. ¿Cuál es su edad actual si hace 3 años era el triple de la de Alfredo?", o:["14 años", "18 años", "7 años", "36 años"], c:3, e:"Planteando el sistema: $J+8 = 2(A+8)$ y $J-3 = 3(A-3)$. Resolviendo, A = 14 y J = 36."},
            {s:'matematicas', q:"Factorizar la expresión: $6a^3bc^5 - 9a^2b^5c + 5ab^4c^3$", o:["$abc(6a^2c^4 - 9ab^4 + 5b^3c^2)$", "$abc(6a^2c^4 - 9ab^4 + 5b^4c^3)$", "$abc(6a^3c^4 - 9ab^5 + 5b^3c^2)$", "$abc(6a^2c^4 - 9ab^5 + 5b^3c^2)$"], c:0, e:"El factor común es $abc$. Al dividir cada término entre $abc$ se obtienen los coeficientes y exponentes correspondientes."},
            {s:'matematicas', q:"En un grupo de 22 trabajadores se graficaron sus edades. El pico de la gráfica está en los 47 años. ¿Cuáles son la mediana y la moda?", o:["47 y 57", "35 y 42", "35 y 47", "47 y 47"], c:3, e:"La moda es la frecuencia más alta (47 años). Al ser 22 datos, la mediana cae entre las posiciones 11 y 12, que también corresponden a la edad de 47 años."},

            {s:'biologia', q:"Los carbohidratos, como la glucosa, son fundamentales para la vida terrestre principalmente porque:", o:["Son fáciles de conseguir en la naturaleza", "La energía de sus enlaces proporciona gran parte de la energía vital", "Son producidos por animales pluricelulares", "Poseen un sabor dulce indispensable"], c:1, e:"Los enlaces químicos de los carbohidratos se rompen durante la respiración celular para liberar energía inmediata (ATP)."},
            {s:'biologia', q:"Es considerada la molécula universal altamente almacenadora de energía (la 'moneda energética' celular):", o:["ADN", "Clorofila", "Hemoglobina", "ATP"], c:3, e:"El Trifosfato de Adenosina (ATP) transfiere la energía química necesaria para las funciones celulares."},
            {s:'biologia', q:"Órgano celular de las plantas, provisto de doble membrana, donde se lleva a cabo la fotosíntesis:", o:["Centrosomas", "Mitocondrias", "Cloroplastos", "Vacuolas"], c:2, e:"Los cloroplastos contienen clorofila, el pigmento capaz de captar la luz solar para sintetizar glucosa."},
            {s:'biologia', q:"Secuencia correcta de las fases de la división celular (Mitosis):", o:["Interfase, profase, anafase, metafase", "Profase, metafase, anafase, telofase", "Telofase, profase, anafase, metafase", "Anafase, profase, telofase, metafase"], c:1, e:"La mnemotecnia común es 'Promete Ana Tejer': Profase, Metafase, Anafase, Telofase."},
            {s:'biologia', q:"Ciertas plantas de los trópicos (epífitas) viven sobre otras de mayor altura para captar luz solar, sin causarles daño. Es un ejemplo de:", o:["Parasitismo", "Mutualismo", "Comensalismo", "Depredación"], c:2, e:"En el comensalismo, una especie se beneficia (capta más luz) y la otra no sufre daño ni beneficio significativo."},
            {s:'biologia', q:"Un insecto como la 'Mantis religiosa' que modifica su aspecto para parecerse a una rama y obtener alimento, ilustra un ejemplo de:", o:["Mutualismo", "Comensalismo", "Mimetismo", "Simbiosis obligada"], c:2, e:"El mimetismo y la coloración disimulada son adaptaciones morfológicas para el camuflaje."},
            {s:'biologia', q:"Un cerdo que alberga en su interior gusanos como el Ascaris o la Trichinella está participando en una relación de:", o:["Endoparásitos", "Mutualismo", "Ectoparásitos", "Simbiosis"], c:0, e:"Al habitar en el interior del huésped (el cerdo) y causarle daño para alimentarse, se clasifican como endoparásitos."},
            {s:'biologia', q:"Dominio taxonómico propuesto por Carl Woese que agrupa a procariotas adaptados a condiciones extremas (alta salinidad, calor térmico):", o:["Eukarya", "Archaea", "Fungi", "Monera"], c:1, e:"Las Arqueobacterias (Archaea) son organismos microscópicos distintos a las bacterias clásicas, famosos por ser extremófilos."},
            {s:'biologia', q:"En la estructura de doble hélice del ADN humano, la Adenina se une siempre por dos puentes de hidrógeno con la:", o:["Citosina", "Guanina", "Timina", "Uracilo"], c:2, e:"Según la regla de Chargaff: la Adenina se une con Timina (A-T) y la Guanina con Citosina (G-C)."},
            {s:'biologia', q:"Autor principal de la teoría de la evolución basada en la Selección Natural:", o:["Jean-Baptiste Lamarck", "Gregor Mendel", "Charles Darwin", "Thomas Morgan"], c:2, e:"Charles Darwin (junto a Wallace) propuso que el entorno ejerce presiones que seleccionan a los individuos mejor adaptados."},
            {s:'biologia', q:"Vía metabólica que ocurre en el citoplasma y degrada la glucosa en dos moléculas de piruvato sin usar oxígeno:", o:["Ciclo de Krebs", "Glucólisis", "Fosforilación oxidativa", "Ciclo de Calvin"], c:1, e:"La glucólisis es la fase inicial tanto de la respiración celular aerobia como de la fermentación anaerobia."},
            {s:'biologia', q:"¿Cuál de los siguientes NO es un postulado de la teoría celular clásica?", o:["Todos los seres vivos están formados por células", "La célula es la unidad fisiológica de la vida", "Toda célula posee un núcleo definido por membrana", "Toda célula proviene de otra preexistente"], c:2, e:"Las células procariotas (como las bacterias) NO poseen un núcleo definido por membrana, por lo tanto, no es un postulado universal."},
            {s:'biologia', q:"Nivel de organización que agrupa a un conjunto de individuos de la MISMA especie que habitan una misma área:", o:["Comunidad", "Bioma", "Ecosistema", "Población"], c:3, e:"Una población se refiere estrictamente a miembros de una misma especie interactuando en un lugar."},

            // HISTORIA 
            {s:'historia', q:"Tratado que dio fin oficial a la Primera Guerra Mundial e impuso duras sanciones a Alemania:", o:["Tratado de Versalles", "Tratado de Tordesillas", "Tratado de Yalta", "Pacto de Varsovia"], c:0, e:"Firmado en 1919, desmanteló el ejército alemán e impuso deudas impagables, sentando las bases de la 2da Guerra."},
            {s:'historia', q:"Periodo de México en el que Plutarco Elías Calles controló la presidencia sin ser el presidente en turno:", o:["Porfiriato", "Reforma", "El Maximato", "Guerra Cristera"], c:2, e:"Calles se autoproclamó 'Jefe Máximo de la Revolución' y controló a tres presidentes (1928-1934)."},
            {s:'historia', q:"Causa inmediata del inicio de la Segunda Guerra Mundial en 1939:", o:["Asesinato del Archiduque Francisco Fernando", "Bombardeo a Pearl Harbor", "Invasión de Alemania a Polonia", "Guerra Civil Española"], c:2, e:"La invasión de Polonia (1 septiembre 1939) provocó que Francia y Gran Bretaña declararan la guerra a la Alemania nazi."},
            {s:'historia', q:"Documento firmado por Santa Anna donde reconocía la independencia de Texas:", o:["Tratados de Córdoba", "Tratados de Velasco", "Tratado de Guadalupe Hidalgo", "Plan de Iguala"], c:1, e:"Firmados en 1836 tras ser capturado en la batalla de San Jacinto."},
            {s:'historia', q:"Presidente que promulgó las Leyes de Reforma (separación Iglesia-Estado):", o:["Benito Juárez", "Sebastián Lerdo de Tejada", "Ignacio Comonfort", "Porfirio Díaz"], c:0, e:"Benito Juárez fue el principal impulsor de estas leyes durante la Guerra de Reforma."},
            {s:'historia', q:"Acontecimiento que marca el inicio de la Edad Contemporánea:", o:["Caída de Constantinopla", "Revolución Rusa", "Revolución Francesa", "Descubrimiento de América"], c:2, e:"La Revolución Francesa (1789) rompe con el Antiguo Régimen, inaugurando la Edad Contemporánea."},
            {s:'historia', q:"Bloque militar creado durante la Guerra Fría para contrarrestar a la OTAN:", o:["ONU", "Liga de las Naciones", "Triple Entente", "Pacto de Varsovia"], c:3, e:"Fue una alianza militar de los países del bloque socialista (liderado por la URSS) en respuesta a la OTAN (capitalistas)."},
            {s:'historia', q:"Plan mediante el cual Francisco I. Madero llamó a levantarse en armas contra Porfirio Díaz:", o:["Plan de Ayala", "Plan de San Luis", "Plan de Guadalupe", "Plan de Tuxtepec"], c:1, e:"Promulgado en 1910, convocó al levantamiento armado el 20 de noviembre de ese año."},
            {s:'historia', q:"Imperio mesoamericano que cayó ante los españoles el 13 de agosto de 1521:", o:["Maya", "Tolteca", "Inca", "Mexica (Azteca)"], c:3, e:"La caída de Tenochtitlán marcó la derrota del Imperio Mexica y el inicio de la época colonial."},
            {s:'historia', q:"Líder de la Revolución Bolchevique que instauró el régimen comunista en Rusia:", o:["Iósif Stalin", "Vladímir Lenin", "León Trotsky", "Zar Nicolás II"], c:1, e:"Lenin lideró el golpe de Estado en octubre de 1917, estableciendo el primer estado socialista del mundo."},
            {s:'historia', q:"Presidente de México que nacionalizó la industria petrolera el 18 de marzo de 1938:", o:["Álvaro Obregón", "Lázaro Cárdenas", "Manuel Ávila Camacho", "Miguel Alemán"], c:1, e:"El General Lázaro Cárdenas expropió el petróleo a las compañías extranjeras tras un conflicto laboral."},
            {s:'historia', q:"El 'Crack del 29' fue una profunda crisis económica iniciada en:", o:["Alemania", "Inglaterra", "Rusia", "Estados Unidos"], c:3, e:"La caída de la bolsa de Wall Street en Nueva York desató la Gran Depresión mundial."},
            {s:'historia', q:"Guerra que México enfrentó por el impago de su deuda externa con Francia (1862-1867):", o:["Guerra de los Pasteles", "Guerra de Castas", "Segunda Intervención Francesa", "Guerra Cristera"], c:2, e:"Resultó en el efímero Segundo Imperio Mexicano bajo el mando de Maximiliano de Habsburgo."},
            {s:'historia', q:"Movimiento filosófico del siglo XVIII que impulsó el uso de la razón y el conocimiento científico:", o:["Renacimiento", "Romanticismo", "La Ilustración", "Positivismo"], c:2, e:"La Ilustración, o 'Siglo de las Luces', cuestionó el poder monárquico y religioso, fundamentando las revoluciones burguesas."},
            {s:'historia', q:"Etapa de tensión política mundial donde hubo carrera armamentista y conquista espacial sin enfrentamiento bélico directo:", o:["Paz Armada", "Guerra Fría", "Imperialismo", "Guerra de los Balcanes"], c:1, e:"La Guerra Fría (1947-1991) enfrentó indirectamente al bloque capitalista y comunista en escenarios periféricos y tecnológicos."},

            // GEOGRAFÍA 
            {s:'geografia', q:"¿Qué país se formó en Europa tras la violenta desintegración de Yugoslavia en la década de los 90?", o:["Ucrania", "Croacia", "Polonia", "Checoslovaquia"], c:1, e:"Yugoslavia se fragmentó en varios países: Croacia, Serbia, Eslovenia, Bosnia, Macedonia y Montenegro."},
            {s:'geografia', q:"Las costas de los estados de Tamaulipas, Veracruz y Tabasco son bañadas por las aguas de:", o:["El Océano Pacífico", "El Mar Caribe", "El Golfo de México", "El Golfo de California"], c:2, e:"Estos estados conforman la principal llanura costera del oriente de México hacia el Golfo de México."},
            {s:'geografia', q:"Tipo de clima predominante en la Península de Yucatán, de acuerdo con el sistema de Köppen:", o:["Seco desértico", "Templado con lluvias en invierno", "Cálido subhúmedo con lluvias en verano", "Polar de Tundra"], c:2, e:"La península es tropical, cálida y recibe fuertes lluvias durante el verano y el paso de huracanes."},
            {s:'geografia', q:"Río que sirve como límite natural en la frontera sur entre México y Belice:", o:["Río Usumacinta", "Río Bravo", "Río Hondo", "Río Suchiate"], c:2, e:"El río Hondo define la frontera con Belice, mientras que el Suchiate y el Usumacinta lo hacen con Guatemala."},
            {s:'geografia', q:"Actividad económica principal que se desarrolla en la sonda de Campeche y Tabasco:", o:["Agricultura de exportación", "Pesca comercial", "Extracción petrolera", "Turismo ecológico"], c:2, e:"Esta zona marina es la región petrolera más importante y productiva de México (ej. Complejo Cantarell)."},
            {s:'geografia', q:"Placas tectónicas responsables de la alta sismicidad en la costa sur y centro de México:", o:["Placa del Pacífico y Nazca", "Placa de Cocos y Norteamericana", "Placa del Caribe y Cocos", "Placa Norteamericana y Euroasiática"], c:1, e:"La placa de Cocos (oceánica) subduce por debajo de la placa Norteamericana (continental), generando los sismos en México."},
            {s:'geografia', q:"Mineral metálico del cual México ha sido históricamente el primer productor a nivel mundial:", o:["Oro", "Cobre", "Plata", "Hierro"], c:2, e:"Zacatecas, Chihuahua y Durango mantienen a México como líder mundial en producción de plata."},
            {s:'geografia', q:"Proyección cartográfica cilíndrica que conserva las formas pero distorsiona enormemente el tamaño hacia los polos:", o:["Proyección de Peters", "Proyección de Mercator", "Proyección Cónica", "Proyección Azimutal"], c:1, e:"Diseñada en 1569 para la navegación. Hace que Groenlandia parezca del tamaño de África (cuando es 14 veces más pequeña)."},
            {s:'geografia', q:"País con la mayor población absoluta del mundo en la actualidad:", o:["Estados Unidos", "China", "India", "Rusia"], c:2, e:"Recientemente, India superó a China como el país más poblado del planeta con más de 1,400 millones de habitantes."},
            {s:'geografia', q:"Movimiento de la Tierra que, combinado con la inclinación del eje terrestre, origina las estaciones del año:", o:["Rotación", "Nutación", "Traslación", "Precesión"], c:2, e:"La traslación (órbita alrededor del sol en 365 días) expone a los hemisferios a diferente radiación según la época del año."},
            {s:'geografia', q:"Continente que presenta la mayor tasa de crecimiento demográfico y natalidad del mundo:", o:["Asia", "América Latina", "África", "Oceanía"], c:2, e:"África tiene la población más joven y las tasas de fecundidad más altas del planeta."},
            {s:'geografia', q:"Organización y tratado internacional vigente para el libre comercio entre México, EE.UU. y Canadá:", o:["TLCAN (NAFTA)", "T-MEC", "Mercosur", "Alianza del Pacífico"], c:1, e:"El Tratado entre México, Estados Unidos y Canadá (T-MEC) reemplazó al antiguo TLCAN en 2020."},
            {s:'geografia', q:"Estado de la República Mexicana caracterizado por tener la mayor diversidad lingüística, cultural y biológica:", o:["Chiapas", "Yucatán", "Michoacán", "Oaxaca"], c:3, e:"Oaxaca es el estado con mayor número de etnias (zapotecos, mixtecos, etc.) y una orografía que fomenta gran biodiversidad."},
            {s:'geografia', q:"La cordillera de los Andes, la más larga del mundo, se localiza en:", o:["América del Sur", "Asia Central", "Norteamérica", "Europa Oriental"], c:0, e:"Recorre toda la costa occidental de Sudamérica, atravesando países como Chile, Perú, Ecuador y Colombia."},
            {s:'geografia', q:"Fenómeno climático que causa un calentamiento anómalo en las aguas del Océano Pacífico Ecuatorial, alterando el clima global:", o:["Efecto Invernadero", "La Niña", "El Niño", "Cambio Climático"], c:2, e:"El Niño (ENSO) calienta el Pacífico, causando sequías en unas regiones e inundaciones severas en otras."},

            // COMPRENSIÓN ESCRITA (ESPAÑOL)
            {s:'escrita', q:"Identifica la oración con concordancia correcta:", o:["Hubieron muchas personas en la fiesta.", "Hubo muchas personas en la fiesta.", "Habían varias personas en la fiesta.", "Han habidos personas en la fiesta."], c:1, e:"El verbo 'haber' es impersonal cuando indica existencia; siempre se conjuga en tercera persona singular (hubo, había)."},
            {s:'escrita', q:"Función de la lengua que busca convencer, persuadir o influir en el receptor:", o:["Función referencial", "Función poética", "Función fática", "Función apelativa"], c:3, e:"La función apelativa o conativa se centra en el receptor, usada comúnmente en discursos políticos y publicidad."},
            {s:'escrita', q:"Elige el nexo coordinante adversativo en la oración: 'Estudió mucho, ___ no aprobó el examen'.", o:["porque", "así que", "pero", "y"], c:2, e:"Los nexos adversativos oponen ideas (pero, mas, sin embargo, sino)."},
            {s:'escrita', q:"¿Cuál de las siguientes palabras es ESDRÚJULA y debe llevar tilde?", o:["Examen", "Volumen", "Critico (verbo criticar)", "Cómputo"], c:3, e:"Las esdrújulas se acentúan en la antepenúltima sílaba y SIEMPRE llevan tilde. 'Examen' y 'volumen' son llanas terminadas en 'n', no llevan tilde."},
            {s:'escrita', q:"Vicio del lenguaje que consiste en el empleo de vocablos innecesarios (redundancia):", o:["Solecismo", "Barbarismo", "Pleonasmo", "Cacofonía"], c:2, e:"Ejemplo de pleonasmo: 'subir para arriba', 'lapso de tiempo', 'verlo con mis propios ojos'."},
            {s:'escrita', q:"En la oración 'La niña compró dulces para su hermano', el objeto indirecto es:", o:["La niña", "compró", "dulces", "para su hermano"], c:3, e:"El Objeto Indirecto responde a la pregunta '¿Para quién?' o '¿A quién?' se realiza la acción."},
            {s:'escrita', q:"Indica el par de palabras homófonas correctas para: 'Espero que él ___ a la casa y salte la ___'.", o:["vaya / vaya", "valla / vaya", "vaya / valla", "valla / valla"], c:2, e:"'Vaya' es del verbo ir (espero que vaya). 'Valla' es una cerca u obstáculo."},
            {s:'escrita', q:"Elige la oración donde se usa correctamente el acento diacrítico:", o:["El me dijo que sí vendría.", "Té sirvo más café.", "Sé más cuidadoso con tú mochila.", "Aún no ha llegado el profesor."], c:3, e:"'Aún' lleva tilde cuando equivale a 'todavía'. 'Él' lleva tilde como pronombre, 'té' como bebida, 'tú' como pronombre, 'sé' del verbo ser/saber."},
            {s:'escrita', q:"Sinónimo de la palabra 'Efímero':", o:["Duradero", "Fugaz", "Eterno", "Frecuente"], c:1, e:"Efímero significa que dura muy poco tiempo, por lo tanto 'fugaz' es su sinónimo directo."},
            {s:'escrita', q:"Sujeto morfológico (tácito) de la oración: 'Llegamos tarde al concierto'.", o:["El concierto", "Tarde", "Nosotros", "Ellos"], c:2, e:"El sujeto no está escrito, pero la terminación del verbo (llegamos) indica que el sujeto implícito es 'nosotros'."},
            {s:'escrita', q:"'Su rostro era de porcelana' es un ejemplo de la figura retórica llamada:", o:["Metáfora", "Símil", "Hipérbaton", "Paradoja"], c:0, e:"Sustituye un término real por uno imaginario por relación de semejanza, sin usar palabras comparativas como 'cual' o 'como'."},
            {s:'escrita', q:"Forma del discurso que relata hechos reales o ficticios en una línea temporal:", o:["Argumentativo", "Descriptivo", "Narrativo", "Expositivo"], c:2, e:"La narrativa cuenta sucesos en el tiempo (inicio, clímax, desenlace)."},
            {s:'escrita', q:"Uso correcto de letras (s, c, z): La mujer tomó una ___ de café y salió de ___.", o:["taza / caza", "tasa / casa", "taza / casa", "tasa / caza"], c:2, e:"Taza (recipiente para beber). Casa (vivienda). (Tasa es índice/impuesto, Caza es atrapar animales)."},
            {s:'escrita', q:"¿Cuál de estas oraciones es compuesta coordinada copulativa?", o:["Te llamé pero no respondiste.", "Iré al cine y comeré palomitas.", "Estudias o trabajas.", "Dijo que vendría pronto."], c:1, e:"Las copulativas unen información sumando elementos usando los nexos: y, e, ni."},
            {s:'escrita', q:"Signo de puntuación que separa oraciones independientes que tienen relación de sentido:", o:["Coma", "Punto y seguido", "Punto y coma", "Dos puntos"], c:2, e:"El punto y coma (;) establece una pausa mayor que la coma y menor que el punto, usada para enlazar oraciones estrechamente relacionadas."},

            // LECTURA / LITERATURA 
            {s:'lectura', q:"Corriente literaria del siglo XIX que busca reflejar la realidad social de forma objetiva, cruda y descriptiva:", o:["Romanticismo", "Realismo", "Vanguardismo", "Modernismo"], c:1, e:"El Realismo se opone a los excesos sentimentales del Romanticismo, enfocándose en problemas sociales de la clase media/baja."},
            {s:'lectura', q:"Premisa 1: Todos los planetas giran alrededor del sol. Premisa 2: Marte es un planeta. Conclusión deductiva:", o:["El sol gira alrededor de Marte.", "Marte gira alrededor del sol.", "Algunos planetas son como Marte.", "Marte no gira alrededor del sol."], c:1, e:"Es un silogismo deductivo básico: lo que aplica a la totalidad aplica al individuo (Marte)."},
            {s:'lectura', q:"Identifica el género literario en el que el autor expresa de forma subjetiva sus sentimientos íntimos (ej. Odas, Sonetos):", o:["Épico", "Lírico", "Dramático", "Didáctico"], c:1, e:"El género lírico (poesía) transmite emociones y sentimientos, originado por los griegos al recitar versos con una lira."},
            {s:'lectura', q:"Lee el refrán: 'Camarón que se duerme, se lo lleva la corriente'. La idea IMPLÍCITA es:", o:["Los crustáceos no deben dormir en el mar.", "Hay que descansar para recuperar fuerzas.", "La falta de atención tiene consecuencias negativas.", "Los ríos tienen corrientes fuertes."], c:2, e:"El significado figurado (implícito) advierte sobre las repercusiones de la pasividad o pereza en la vida."},
            {s:'lectura', q:"El 'Boom Latinoamericano' fue un fenómeno literario del siglo XX. Un autor representativo es:", o:["Miguel de Cervantes", "Sor Juana Inés de la Cruz", "Gabriel García Márquez", "Rubén Darío"], c:2, e:"García Márquez (Cien años de soledad) fue figura central del Boom junto a Vargas Llosa, Cortázar y Fuentes."},
            {s:'lectura', q:"¿Cuál es el propósito principal de un texto argumentativo (ej. un ensayo)?", o:["Informar sobre un suceso reciente", "Entretener al lector con una historia", "Describir detalladamente un paisaje", "Persuadir al lector sobre una tesis o punto de vista"], c:3, e:"Todo texto argumentativo defiende una postura (tesis) usando premisas válidas para convencer a la audiencia."},
            {s:'lectura', q:"'Eres más lento que una tortuga amarrada' es un ejemplo de la figura retórica:", o:["Hipérbaton", "Símil", "Metáfora", "Hipérbole"], c:3, e:"La hipérbole es una exageración intencional de la realidad para dar mayor impacto al mensaje."},
            {s:'lectura', q:"Identifica el texto periodístico que mezcla información objetiva con la opinión personal del redactor:", o:["Noticia", "Artículo de opinión o Crónica", "Reportaje", "Editorial"], c:1, e:"La crónica o artículo interpretativo relata el hecho pero incluye la perspectiva de quien lo firma (a diferencia de la noticia pura)."},
            {s:'lectura', q:"Corriente poética nacida en América Latina, liderada por Rubén Darío, caracterizada por la estética y preciosismo:", o:["Romanticismo", "Modernismo", "Neoclasicismo", "Naturalismo"], c:1, e:"El Modernismo hispanoamericano (finales del S. XIX) buscaba la belleza estética absoluta (símbolo: el cisne)."},
            {s:'lectura', q:"Un texto expositivo tiene como característica principal:", o:["Tono subjetivo e íntimo", "Uso abundante de diálogos literarios", "Lenguaje objetivo, claro y uso de tecnicismos", "Finalidad persuasiva de compra"], c:2, e:"Busca explicar o informar hechos, conceptos o descubrimientos sin incluir opiniones (ej. textos escolares, enciclopedias)."},
            {s:'lectura', q:"Orden correcto de una ficha hemerográfica (de periódico o revista):", o:["Autor, título del artículo, nombre de la publicación, fecha, página.", "Nombre del libro, editorial, ciudad, año.", "URL, fecha de consulta, autor.", "Tema, resumen, autor del comentario."], c:0, e:"La ficha hemerográfica registra datos de publicaciones periódicas (revistas, periódicos). La B es bibliográfica."},
            {s:'lectura', q:"En 'Cien años de soledad', ¿a qué se refiere el término 'Realismo Mágico'?", o:["Mostrar la magia como una ilusión", "Introducir elementos fantásticos o irreales como algo cotidiano", "Hacer magia real mediante tecnología", "Ignorar la realidad por completo"], c:1, e:"Es la principal característica estética de García Márquez, donde lo sobrenatural se narra con absoluta naturalidad."},
            {s:'lectura', q:"'Sus cabellos son oro' es metáfora; 'Sus cabellos son COMO oro' es:", o:["Paradoja", "Metonimia", "Símil (o comparación)", "Prosopopeya"], c:2, e:"El símil establece una comparación explícita usando nexos comparativos: como, cual, parece, igual a."},
            {s:'lectura', q:"Tono de un texto que utiliza burlas sutiles para criticar algo, diciendo lo contrario de lo que se piensa:", o:["Didáctico", "Melancólico", "Irónico", "Informativo"], c:2, e:"La ironía es un recurso retórico que se usa a menudo como herramienta de crítica social o humor mordaz."},
            {s:'lectura', q:"Obra cumbre de la épica castellana medieval (Cantar de gesta):", o:["Don Quijote de la Mancha", "El Cantar de Mio Cid", "La Divina Comedia", "El Laberinto de la Soledad"], c:1, e:"Es el primer gran poema épico conservado de la literatura española, basado en la vida del caballero Rodrigo Díaz de Vivar."}
        ];

        // --- ESTADO DE LA APP ---
        let userQuestions = [];
        let activeQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let currentSubject = '';

        const subjectsInfo = {
            'matematicas': { title: 'Matemáticas', colorClass: 'tile-matematicas', icon: '📐' },
            'fisica': { title: 'Física', colorClass: 'tile-fisica', icon: '⚛️' },
            'quimica': { title: 'Química', colorClass: 'tile-quimica', icon: '🧪' },
            'biologia': { title: 'Biología', colorClass: 'tile-biologia', icon: '🧬' },
            'historia': { title: 'Historia', colorClass: 'tile-historia', icon: '🏛️' },
            'geografia': { title: 'Geografía', colorClass: 'tile-geografia', icon: '🌍' },
            'escrita': { title: 'Español (Escrita)', colorClass: 'tile-escrita', icon: '✍️' },
            'lectura': { title: 'Lectura/Lit.', colorClass: 'tile-lectura', icon: '📖' }
        };

        const appContainer = document.getElementById('app-container');
        const scoreDisplay = document.getElementById('score-display');
        const navQuiz = document.getElementById('nav-quiz');
        const navStats = document.getElementById('nav-stats');

        // --- INICIALIZACIÓN ---
        function initApp() {
            const saved = localStorage.getItem('lockin_user_qs');
            if (saved) {
                userQuestions = JSON.parse(saved);
            }
            goHome(); 
        }

        // --- NAVEGACIÓN ---
        function setActiveNav(tab) {
            navQuiz.classList.remove('text-rose-600');
            navStats.classList.remove('text-rose-600');
            if(tab === 'quiz') navQuiz.classList.add('text-rose-600');
            if(tab === 'stats') navStats.classList.add('text-rose-600');
        }

        function goHome() {
            setActiveNav('quiz');
            scoreDisplay.classList.add('hidden');
            
            let allQ = [...examQuestions, ...userQuestions];
            
            let html = `
                <div class="px-4 py-6 animate-pop pb-20">
                    <h2 class="text-3xl font-black mb-1">Simulador UNAM/IPN</h2>
                    <p class="text-slate-500 mb-6 font-semibold">Selecciona el módulo a entrenar:</p>
                    <div class="grid grid-cols-2 gap-4">
            `;

            for (const [key, info] of Object.entries(subjectsInfo)) {
                let qCount = allQ.filter(q => q.s === key).length;
                html += `
                    <div onclick="startQuiz('${key}')" class="rounded-3xl p-5 shadow-lg text-white cursor-pointer transform transition active:scale-95 ${info.colorClass}">
                        <div class="text-4xl mb-3">${info.icon}</div>
                        <h3 class="font-bold text-lg leading-tight tracking-wide">${info.title}</h3>
                        <p class="text-xs opacity-90 mt-1 font-semibold">${qCount} Reactivos</p>
                    </div>
                `;
            }

            html += `
                    <div onclick="renderAddQuestion()" class="rounded-3xl p-5 shadow-sm text-slate-600 bg-slate-200 cursor-pointer transform transition active:scale-95 flex flex-col justify-center items-center border-2 border-dashed border-slate-400 hover:bg-slate-300">
                        <div class="text-3xl mb-2">➕</div>
                        <h3 class="font-bold text-sm leading-tight text-center">Añadir<br>Pregunta</h3>
                    </div>
            `;

            html += `</div></div>`;
            appContainer.innerHTML = html;
        }

        // --- SISTEMA DE ESTADÍSTICAS ---
        function saveSessionStat(subject, score, total) {
            let history = JSON.parse(localStorage.getItem('lockin_stats')) || [];
            history.push({
                subject: subject,
                score: score,
                total: total,
                date: new Date().toISOString()
            });
            localStorage.setItem('lockin_stats', JSON.stringify(history));
        }

        function renderStats() {
            setActiveNav('stats');
            scoreDisplay.classList.add('hidden');
            let history = JSON.parse(localStorage.getItem('lockin_stats')) || [];
            
            let html = `
                <div class="px-4 py-6 animate-pop pb-20">
                    <h2 class="text-3xl font-black mb-1">Tu Progreso 📈</h2>
                    <p class="text-slate-500 mb-6 font-semibold">Efectividad general acumulada por materia.</p>
                    <div class="space-y-4">
            `;

            if(history.length === 0) {
                html += `<div class="bg-white p-8 rounded-3xl text-center shadow-sm border border-slate-200">
                            <span class="text-5xl block mb-4">🤷‍♂️</span>
                            <p class="text-slate-500 font-bold text-lg">Aún no has completado ninguna prueba.</p>
                            <p class="text-slate-400 text-sm mt-2">Ve a la pestaña Quiz y ponte a prueba.</p>
                         </div>`;
            } else {
                for (const [key, info] of Object.entries(subjectsInfo)) {
                    let subHistory = history.filter(h => h.subject === key);
                    if(subHistory.length === 0) continue;

                    let totalQuestions = 0;
                    let totalCorrect = 0;
                    subHistory.forEach(s => {
                        totalQuestions += s.total;
                        totalCorrect += s.score;
                    });
                    
                    let percentage = Math.round((totalCorrect / totalQuestions) * 100);
                    let barColor = percentage >= 80 ? 'bg-emerald-500' : (percentage >= 60 ? 'bg-amber-400' : 'bg-rose-500');

                    html += `
                        <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                            <div class="flex justify-between items-center mb-3">
                                <span class="font-bold text-slate-700 flex items-center space-x-2 text-lg">
                                    <span>${info.icon}</span> <span>${info.title}</span>
                                </span>
                                <span class="font-black text-xl ${percentage >= 80 ? 'text-emerald-600' : 'text-slate-700'}">${percentage}%</span>
                            </div>
                            <div class="w-full bg-slate-100 rounded-full h-4">
                                <div class="${barColor} h-4 rounded-full transition-all duration-1000" style="width: ${percentage}%"></div>
                            </div>
                            <p class="text-[11px] font-bold text-slate-400 mt-3 uppercase tracking-wide">
                                ${totalCorrect} aciertos de ${totalQuestions} respondidas.
                            </p>
                        </div>
                    `;
                }
            }

            html += `
                    <button onclick="clearStats()" class="mt-8 w-full py-4 font-bold text-rose-500 bg-rose-50 rounded-2xl hover:bg-rose-100 transition shadow-sm border border-rose-100 active:scale-95">
                        🗑️ Borrar todo mi progreso
                    </button>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        function clearStats() {
            // Usando el modal personalizado en lugar del "confirm()" de iOS
            showModal(
                "Borrar Progreso", 
                "¿Estás seguro de que quieres borrar todo tu historial de aciertos y errores? Esto no se puede deshacer.", 
                "confirm", 
                function() {
                    localStorage.removeItem('lockin_stats');
                    renderStats();
                }
            );
        }

        // --- MOTOR DEL QUIZ ---
        function startQuiz(subject) {
            currentSubject = subject;
            
            let allQ = [...examQuestions, ...userQuestions];
            let rawQuestions = allQ.filter(q => q.s === subject);
            
            if (rawQuestions.length === 0) {
                showModal("¡Ups!", "No hay preguntas en esta materia. ¡Añade algunas primero!", "alert");
                return;
            }
            
            activeQuestions = rawQuestions.sort(() => Math.random() - 0.5);
            
            currentQuestionIndex = 0;
            score = 0;
            
            scoreDisplay.classList.remove('hidden');
            scoreDisplay.innerHTML = `⭐ 0 / ${activeQuestions.length}`;
            
            renderQuestion();
        }

        function renderQuestion() {
            const qData = activeQuestions[currentQuestionIndex];
            const info = subjectsInfo[currentSubject];
            
            let html = `
                <div class="px-4 py-4 animate-pop flex flex-col h-full min-h-screen">
                    <div class="mb-4 flex items-center space-x-2">
                        <span class="text-2xl">${info.icon}</span>
                        <span class="font-bold text-slate-500 uppercase tracking-widest text-xs">${info.title} - PREGUNTA ${currentQuestionIndex + 1} DE ${activeQuestions.length}</span>
                    </div>
                    
                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 mb-6 flex-grow flex items-center justify-center">
                        <h2 class="text-xl sm:text-2xl font-extrabold text-center text-slate-800 leading-snug">${qData.q}</h2>
                    </div>

                    <div class="grid grid-cols-1 gap-3 mb-6" id="options-container">
            `;

            qData.o.forEach((opt, index) => {
                html += `
                    <button onclick="checkAnswer(${index})" class="btn-option w-full bg-white border-2 border-slate-200 text-slate-700 font-bold py-4 px-5 rounded-2xl text-left text-base shadow-sm hover:border-slate-300">
                        ${opt}
                    </button>
                `;
            });

            html += `
                    </div>
                    <div id="feedback-container" class="hidden flex-col items-center justify-center p-6 rounded-3xl text-center mb-8 shadow-inner">
                        <p id="feedback-msg" class="font-black text-2xl mb-2"></p>
                        <p id="feedback-exp" class="text-sm font-semibold opacity-95 leading-relaxed"></p>
                        <button onclick="nextQuestion()" class="mt-6 w-full max-w-[200px] bg-white text-slate-900 font-black py-4 px-8 rounded-2xl shadow-lg active:scale-95 transition">
                            SIGUIENTE ➔
                        </button>
                    </div>
                </div>
            `;
            
            appContainer.innerHTML = html;
            window.scrollTo(0, 0);
            renderMath();
        }

        function checkAnswer(selectedIndex) {
            const qData = activeQuestions[currentQuestionIndex];
            const options = document.getElementById('options-container').children;
            const feedbackContainer = document.getElementById('feedback-container');
            const feedbackMsg = document.getElementById('feedback-msg');
            const feedbackExp = document.getElementById('feedback-exp');
            
            for(let i=0; i<options.length; i++) {
                options[i].disabled = true;
                options[i].classList.add('opacity-40');
            }

            options[qData.c].classList.remove('opacity-40', 'bg-white', 'border-slate-200');
            options[qData.c].classList.add('correct-answer');

            if (selectedIndex === qData.c) {
                score++;
                scoreDisplay.innerHTML = `⭐ ${score} / ${activeQuestions.length}`;
                feedbackContainer.classList.add('bg-emerald-500', 'text-white', 'animate-pop');
                feedbackContainer.classList.remove('hidden');
                feedbackMsg.innerText = "¡CORRECTO! 🔥";
            } else {
                options[selectedIndex].classList.remove('opacity-40', 'bg-white', 'border-slate-200');
                options[selectedIndex].classList.add('wrong-answer');
                feedbackContainer.classList.add('bg-rose-500', 'text-white', 'animate-pop');
                feedbackContainer.classList.remove('hidden');
                feedbackMsg.innerText = "INCORRECTO 💔";
            }
            
            feedbackExp.innerText = qData.e;
            renderMath(); 
            
            setTimeout(() => {
                feedbackContainer.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 100);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) {
                renderQuestion();
            } else {
                saveSessionStat(currentSubject, score, activeQuestions.length);
                renderResults();
            }
        }

        function renderResults() {
            scoreDisplay.classList.add('hidden');
            const percentage = Math.round((score / activeQuestions.length) * 100);
            
            let msgTitle, msgSub, bgClass, txtClass;
            
            if(percentage >= 80) {
                msgTitle = "¡NIVEL UNAM/IPN! 🚀";
                msgSub = "Estás listo para asegurar tu lugar. Brutal.";
                bgClass = "bg-emerald-100 border-emerald-200";
                txtClass = "text-emerald-600";
            } else if (percentage >= 60) {
                msgTitle = "¡BUEN TRABAJO! 📚";
                msgSub = "Andas cerca del puntaje de corte. Afina los detalles.";
                bgClass = "bg-amber-100 border-amber-200";
                txtClass = "text-amber-600";
            } else {
                msgTitle = "MODO LOCK IN REQUERIDO 🔒";
                msgSub = "No te rindas. Usa las explicaciones para aprender de los errores.";
                bgClass = "bg-rose-100 border-rose-200";
                txtClass = "text-rose-600";
            }
            
            let html = `
                <div class="px-4 py-8 flex flex-col items-center justify-center text-center animate-pop h-full min-h-[80vh] pb-24">
                    <div class="text-7xl mb-4">🏆</div>
                    <h2 class="text-3xl font-black mb-2 text-slate-800">${msgTitle}</h2>
                    <p class="text-slate-500 font-bold text-sm mb-8 px-4">${msgSub}</p>
                    
                    <div class="${bgClass} border-2 rounded-3xl p-8 mb-10 w-full max-w-xs shadow-sm">
                        <p class="${txtClass} font-bold uppercase tracking-widest text-xs mb-1">Tu Resultado</p>
                        <p class="text-7xl font-black ${txtClass}">${score}</p>
                        <p class="${txtClass} font-bold text-sm mt-1">de ${activeQuestions.length} correctas</p>
                        
                        <div class="mt-6 pt-4 border-t-2 border-white/50">
                            <p class="${txtClass} font-black text-2xl">${percentage}% de efectividad</p>
                        </div>
                    </div>

                    <div class="w-full max-w-xs space-y-3">
                        <button onclick="renderStats()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-4 px-6 rounded-2xl text-lg shadow-xl active:scale-95 transition">
                            Ver Estadísticas 📈
                        </button>
                    </div>
                </div>
            `;
            appContainer.innerHTML = html;
        }

        // --- CREADOR DE PREGUNTAS ---
        function renderAddQuestion() {
            scoreDisplay.classList.add('hidden');
            let subjOptions = '';
            for (const [key, info] of Object.entries(subjectsInfo)) {
                subjOptions += `<option value="${key}">${info.title}</option>`;
            }

            let html = `
                <div class="px-4 py-6 animate-pop pb-24">
                    <div class="flex items-center mb-6">
                        <button onclick="goHome()" class="mr-4 text-slate-400 hover:text-slate-600">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                        </button>
                        <h2 class="text-2xl font-black text-slate-800">Crear Pregunta</h2>
                    </div>

                    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-200 space-y-4">
                        <p class="text-xs text-slate-500 mb-2 font-bold bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                            💡 Tip: Puedes usar notación LaTeX para fórmulas encerrando el texto entre signos de dólar (Ejemplo: $x^2 + y^2 = r^2$). No olvides usar doble diagonal invertida (Ej: $\\\\frac{1}{2}$).
                        </p>
                        
                        <div>
                            <label class="block font-bold text-slate-600 text-sm mb-1">Materia</label>
                            <select id="new-subj" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 font-semibold text-slate-700 outline-none focus:border-rose-500 transition">
                                ${subjOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-600 text-sm mb-1">Pregunta (Examen)</label>
                            <textarea id="new-q" rows="2" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 font-semibold text-slate-700 outline-none focus:border-rose-500 transition" placeholder="Ej: ¿Cuál es la derivada de sen(x)?"></textarea>
                        </div>
                        
                        <div class="space-y-3 pt-2">
                            <label class="block font-bold text-slate-600 text-sm">Opciones (Marca la correcta)</label>
                            <div class="flex items-center space-x-3">
                                <input type="radio" name="correct-opt" value="0" checked class="w-5 h-5 text-rose-600 accent-rose-600">
                                <input id="opt-0" type="text" class="flex-grow bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold outline-none focus:border-rose-500 transition" placeholder="Opción A (Correcta por defecto)">
                            </div>
                            <div class="flex items-center space-x-3">
                                <input type="radio" name="correct-opt" value="1" class="w-5 h-5 text-rose-600 accent-rose-600">
                                <input id="opt-1" type="text" class="flex-grow bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold outline-none focus:border-rose-500 transition" placeholder="Opción B">
                            </div>
                            <div class="flex items-center space-x-3">
                                <input type="radio" name="correct-opt" value="2" class="w-5 h-5 text-rose-600 accent-rose-600">
                                <input id="opt-2" type="text" class="flex-grow bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold outline-none focus:border-rose-500 transition" placeholder="Opción C">
                            </div>
                            <div class="flex items-center space-x-3">
                                <input type="radio" name="correct-opt" value="3" class="w-5 h-5 text-rose-600 accent-rose-600">
                                <input id="opt-3" type="text" class="flex-grow bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-2 text-sm font-semibold outline-none focus:border-rose-500 transition" placeholder="Opción D">
                            </div>
                        </div>

                        <div>
                            <label class="block font-bold text-slate-600 text-sm mb-1 mt-4">Explicación (Feedback)</label>
                            <input id="new-exp" type="text" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 text-sm font-semibold outline-none focus:border-emerald-500 transition" placeholder="Ej: La regla de derivación indica que...">
                        </div>
                    </div>

                    <button onclick="saveQuestion()" class="mt-6 w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-4 px-6 rounded-2xl text-lg shadow-xl active:scale-95 transition">
                        Guardar Pregunta
                    </button>
                </div>
            `;
            appContainer.innerHTML = html;
            window.scrollTo(0, 0);
        }

        function saveQuestion() {
            const subj = document.getElementById('new-subj').value;
            const q = document.getElementById('new-q').value.trim();
            const opt0 = document.getElementById('opt-0').value.trim();
            const opt1 = document.getElementById('opt-1').value.trim();
            const opt2 = document.getElementById('opt-2').value.trim();
            const opt3 = document.getElementById('opt-3').value.trim();
            const exp = document.getElementById('new-exp').value.trim() || "Pregunta personalizada agregada por ti.";
            const correctRadio = document.querySelector('input[name="correct-opt"]:checked');

            if (!q || !opt0 || !opt1 || !opt2 || !opt3) {
                showModal("Faltan datos", "Completa la pregunta y las 4 opciones antes de guardar.", "alert");
                return;
            }

            const newQ = {
                s: subj,
                q: q,
                o: [opt0, opt1, opt2, opt3],
                c: parseInt(correctRadio.value),
                e: exp
            };

            userQuestions.push(newQ);
            localStorage.setItem('lockin_user_qs', JSON.stringify(userQuestions));
            
            showModal("¡Guardado!", "La pregunta se agregó con éxito a tu banco de estudio.", "alert", function() {
                goHome();
            });
        }

        // Iniciar
        window.onload = initApp;
    </script>
</body>
</html>
