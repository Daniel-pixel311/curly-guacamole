    <script>
        function showModal(title, message, type = 'alert', onConfirm = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-msg').innerText = message;
            
            let btnHtml = '';
            if (type === 'alert') {
                btnHtml = `<button onclick="closeModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition active:scale-95">Entendido</button>`;
            } else if (type === 'confirm') {
                btnHtml = `
                    <button onclick="closeModal()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-3 rounded-xl transition active:scale-95">Cancelar</button>
                    <button id="btn-modal-confirm" class="w-1/2 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition active:scale-95">Sí, borrar</button>
                `;
            }
            
            document.getElementById('modal-buttons').innerHTML = btnHtml;
            document.getElementById('custom-modal').classList.remove('hidden');

            if (type === 'confirm' && onConfirm) {
                document.getElementById('btn-modal-confirm').onclick = () => {
                    onConfirm();
                    closeModal();
                };
            }
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

            {s:'fisica', q:"Fuerza de empuje que recibe un cuerpo sumergido es igual al peso del fluido desplazado:", o:["Arquímedes", "Pascal", "Newton", "Boyle"], c:0, e:"Es el enunciado exacto del Principio de Arquímedes (flotabilidad)."},
            {s:'fisica', q:"Cambio aparente en la frecuencia de una onda debido al movimiento relativo entre la fuente y el observador:", o:["Efecto Compton", "Efecto Fotoeléctrico", "Efecto Doppler", "Difracción"], c:2, e:"El Efecto Doppler explica por qué la sirena de una ambulancia cambia de tono al acercarse y alejarse."},
            {s:'fisica', q:"¿A cuántos grados Kelvin equivalen 20 °C?", o:["253.15 K", "273.15 K", "293.15 K", "313.15 K"], c:2, e:"Fórmula: K = °C + 273.15. Por lo tanto, 20 + 273.15 = 293.15 K."},
            {s:'fisica', q:"Un auto viaja a una velocidad constante de 20 m/s durante 10 segundos. ¿Qué distancia recorre?", o:["2 m", "200 m", "0.5 m", "2000 m"], c:1, e:"La fórmula del MRU es $d = v \\times t$. Multiplicando $20 \\, \\text{m/s} \\times 10 \\, \\text{s}$ obtenemos 200 metros."},
            {s:'fisica', q:"La Segunda Ley de Newton establece que la aceleración de un objeto es directamente proporcional a:", o:["Su masa", "La fuerza neta aplicada", "Su velocidad inicial", "El tiempo de contacto"], c:1, e:"La fórmula $F = m \\times a$ (o $a = F/m$) indica que la aceleración crece de manera proporcional a la fuerza."},
            {s:'fisica', q:"El fenómeno de la refracción de la luz ocurre cuando:", o:["La luz rebota en una superficie pulida", "La luz cambia de dirección al pasar a un medio de distinta densidad", "La luz es absorbida por un cuerpo negro", "Dos ondas de luz se superponen"], c:1, e:"La refracción es el cambio de dirección y velocidad que experimenta una onda al pasar de un medio a otro (ej. aire al agua)."},
            {s:'fisica', q:"Energía que posee un cuerpo debido a su posición o altura:", o:["Cinética", "Mecánica", "Potencial gravitatoria", "Térmica"], c:2, e:"La energía potencial gravitatoria ($E_p = mgh$) depende de la masa, la gravedad y la altura a la que se encuentre el objeto."},
            // ==========================================
            // BLOQUE DE EXPANSIÓN: FÍSICA (Reactivos 16 al 25)
            // ==========================================
            {s:'fisica', q:"Un cuerpo con una masa de $4 \\, \\text{kg}$ se desplaza describiendo un movimiento circular uniforme con un radio de $2 \\, \\text{m}$ y una velocidad lineal constante de $6 \\, \\text{m/s}$. ¿Cuál es la magnitud de la fuerza centrípeta que experimenta?", o:["$12 \\, \\text{N}$", "$48 \\, \\text{N}$", "$72 \\, \\text{N}$", "$36 \\, \\text{N}$"], c:2, e:"La fuerza centrípeta se calcula mediante la fórmula matemática $F_c = \\frac{m \\cdot v^2}{r}$. Sustituyendo los datos del problema: $F_c = \\frac{4 \\cdot (6)^2}{2} = \\frac{4 \\cdot 36}{2} = 2 \\cdot 36 = 72 \\, \\text{N}$."},
            {s:'fisica', q:"De acuerdo con la ley de Ohm y la resistividad eléctrica, si duplicamos la longitud de un cable conductor y al mismo tiempo reducimos su área transversal a la mitad, ¿qué le ocurre a su resistencia eléctrica original?", o:["Se mantiene igual", "Se duplica", "Se reduce a la cuarta parte", "Se cuadruplica"], c:3, e:"La resistencia de un conductor se calcula mediante $R = \\rho \\frac{L}{A}$. Si la nueva longitud es $2L$ y la nueva área es $A/2$, sustituimos: $R_{nueva} = \\rho \\frac{2L}{A/2} = 4 \\left(\\rho \\frac{L}{A}\\right) = 4R$. La resistencia se cuadruplica."},
            {s:'fisica', q:"Una máquina térmica absorbe exactamente $1000 \\, \\text{J}$ de calor desde un depósito caliente y realiza simultáneamente un trabajo mecánico de $400 \\, \\text{J}$ por ciclo. Calcula la eficiencia térmica de la máquina y el calor desechado hacia el depósito frío.", o:["Eficiencia $= 40\\%$, Calor desechado $= 600 \\, \\text{J}$", "Eficiencia $= 60\\%$, Calor desechado $= 400 \\, \\text{J}$", "Eficiencia $= 40\\%$, Calor desechado $= 1400 \\, \\text{J}$", "Eficiencia $= 25\\%$, Calor desechado $= 600 \\, \\text{J}$"], c:0, e:"La eficiencia térmica es $\\eta = \\frac{W}{Q_H} = \\frac{400}{1000} = 0.4$ o $40\\%$. Por la primera ley de la termodinámica, el calor liberado al depósito frío es $Q_C = Q_H - W = 1000 - 400 = 600 \\, \\text{J}$."},
            {s:'fisica', q:"¿Cuál es la presión hidrostática que experimenta un buzo sumergido a una profundidad de $30 \\, \\text{m}$ bajo el agua dulce? (Considera $\\rho_{agua} = 1000 \\, \\text{kg/m}^3$ y $g = 9.8 \\, \\text{m/s}^2$)", o:["$294,000 \\, \\text{Pa}$", "$29,400 \\, \\text{Pa}$", "$3,000 \\, \\text{Pa}$", "$98,000 \\, \\text{Pa}$"], c:0, e:"La presión hidrostática se calcula con la ecuación $P = \\rho \\cdot g \\cdot h$. Sustituyendo los valores provistos por el problema: $P = 1000 \\, \\text{kg/m}^3 \\times 9.8 \\, \\text{m/s}^2 \\times 30 \\, \\text{m} = 294,000 \\, \\text{Pa}$ (o $294 \\, \\text{kPa}$)"},
            {s:'fisica', q:"Dos cargas puntuales eléctricas de $q_1 = +2 \\, \\mu\\text{C}$ y $q_2 = +4 \\, \\mu\\text{C}$ se encuentran separadas a una distancia física de $2 \\, \\text{m}$ en el vacío. Determina la fuerza electrostática de repulsión entre ellas.", o:["$18 \\times 10^{-3} \\, \\text{N}$", "$0.018 \\, \\text{N}$", "$1.8 \\, \\text{N}$", "$36 \\times 10^{-3} \\, \\text{N}$"], c:1, e:"Usando la ley de Coulomb: $F = k \\frac{|q_1 \\cdot q_2|}{r^2}$. Sustituyendo: $F = (9 \\times 10^9) \\frac{(2 \\times 10^{-6})(4 \\times 10^{-6})}{(2)^2} = (9 \\times 10^9) \\frac{8 \\times 10^{-12}}{4} = (9 \\times 10^9)(2 \\times 10^{-12}) = 18 \\times 10^{-3} \\, \\text{N} = 0.018 \\, \\text{N}$."},
            {s:'fisica', q:"De acuerdo con los principios de la óptica geométrica, si un objeto se coloca a una distancia de $15 \\, \\text{cm}$ frente a un espejo cóncavo que posee una distancia focal de $10 \\, \\text{cm}$, ¿a qué distancia del espejo se formará la imagen real?", o:["$6 \\, \\text{cm}$", "$30 \\, \\text{cm}$", "$25 \\, \\text{cm}$", "$15 \\, \\text{cm}$"], c:1, e:"Utilizando la ecuación de los espejos esféricos delgados: $\\frac{1}{f} = \\frac{1}{d_o} + \\frac{1}{d_i}$. Despejando el término de la imagen: $\\frac{1}{10} = \\frac{1}{15} + \\frac{1}{d_i} \\rightarrow \\frac{1}{d_i} = \\frac{1}{10} - \\frac{1}{15} = \\frac{3-2}{30} = \\frac{1}{30}$. Por lo tanto, $d_i = 30 \\, \\text{cm}$."},
            {s:'fisica', q:"Un tren de ondas viaja con una velocidad de propagación constante de $340 \\, \\text{m/s}$. Si la longitud de onda medida es de exactamente $0.5 \\, \\text{m}$, calcula la frecuencia de la onda y determina su periodo de oscilación.", o:["$680 \\, \\text{Hz}$ y $1.47 \\times 10^{-3} \\, \\text{s}$", "$170 \\, \\text{Hz}$ y $5.88 \\times 10^{-3} \\, \\text{s}$", "$680 \\, \\text{Hz}$ y $0.5 \\, \\text{s}$", "$340 \\, \\text{Hz}$ y $2.94 \\times 10^{-3} \\, \\text{s}$"], c:0, e:"La ecuación fundamental de la onda es $v = \\lambda \\cdot f$. Despejando frecuencia: $f = v / \\lambda = 340 / 0.5 = 680 \\, \\text{Hz}$. El periodo es el inverso de la frecuencia: $T = 1 / f = 1 / 680 \\approx 0.00147 \\, \\text{s}$ o $1.47 \\times 10^{-3} \\, \\text{s}$."},
            {s:'fisica', q:"Un bloque de madera permanece flotando en un estanque. Si el $30\\%$ del volumen total del bloque se encuentra emergiendo de la superficie del agua, ¿cuál es la densidad del bloque de madera?", o:["$300 \\, \\text{kg/m}^3$", "$700 \\, \\text{kg/m}^3$", "$1000 \\, \\text{kg/m}^3$", "$450 \\, \\text{kg/m}^3$"], c:1, e:"Por el principio de Arquímedes, la fracción del volumen sumergido es directamente proporcional a la relación de densidades: $\\frac{V_{sumergido}}{V_{total}} = \\frac{\\rho_{cuerpo}}{\\rho_{fluido}}$. Si emerge el $30\\%$, significa que el $70\\%$ está sumergido. Por tanto, $\\rho_{cuerpo} = 0.70 \\times 1000 \\, \\text{kg/m}^3 = 700 \\, \\text{kg/m}^3$."},
            {s:'fisica', q:"En un circuito de corriente alterna, un capacitor ideal tiene una reactancia capacitiva de $50 \\, \\Omega$ y se conecta en serie a una resistencia pura de $120 \\, \\Omega$. Calcula la impedancia total del circuito Z.", o:["$170 \\, \\Omega$", "$130 \\, \\Omega$", "$70 \\, \\Omega$", "$150 \\, \\Omega$"], c:1, e:"La impedancia en un circuito RC serie se calcula vectorialmente debido al desfase de fase de 90 grados: $Z = \\sqrt{R^2 + X_C^2}$. Sustituyendo: $Z = \\sqrt{120^2 + 50^2} = \\sqrt{14400 + 2500} = \\sqrt{16900} = 130 \\, \\Omega$."},
            {s:'fisica', q:"Un proyectil es lanzado con una velocidad inicial de $50 \\, \\text{m/s}$ y un ángulo de elevación de $30^\\circ$ respecto a la horizontal. Calcula la componente vertical de su velocidad inicial ($V_{0y}$). (Considera $\\sin 30^\\circ = 0.5$, $\\cos 30^\\circ = 0.866$)", o:["$25 \\, \\text{m/s}$", "$43.3 \\, \\text{m/s}$", "$50 \\, \\text{m/s}$", "$12.5 \\, \\text{m/s}$"], c:0, e:"La componente vertical de la velocidad inicial en un tiro parabólico se calcula mediante la función trigonométrica seno: $V_{0y} = V_0 \\cdot \\sin(\\theta)$. Sustituyendo: $V_{0y} = 50 \\, \\text{m/s} \\times \\sin(30^\\circ) = 50 \\times 0.5 = 25 \\, \\text{m/s}$."},

            // QUÍMICA (15)
            {s:'quimica', q:"Partícula subatómica responsable de la formación de enlaces químicos:", o:["Neutrón", "Protón", "Positrón", "Electrón de valencia"], c:3, e:"Los electrones de la capa más externa (valencia) son los que se comparten o ceden para formar enlaces."},
            {s:'quimica', q:"Número cuántico principal 'n' determina:", o:["La forma del orbital", "El nivel de energía y tamaño", "La orientación espacial", "El espín del electrón"], c:1, e:"El número 'n' (1, 2, 3...) indica el nivel energético y la distancia promedio del núcleo (tamaño)."},
            {s:'quimica', q:"¿Cuántos moles hay en 36 gramos de agua (H₂O)?", o:["1 mol", "2 moles", "3 moles", "0.5 moles"], c:1, e:"Masa molar H₂O = (2x1) + 16 = 18 g/mol. Moles = Masa / Masa molar = 36 / 18 = 2 moles."},
            {s:'quimica', q:"En una reacción REDOX, el agente oxidante es la especie química que:", o:["Cede protones", "Se oxida", "Gana electrones (se reduce)", "Pierde electrones"], c:2, e:"El agente oxidante provoca la oxidación de otro, y al hacerlo, él mismo acepta esos electrones (se reduce)."},
            {s:'quimica', q:"Según Brønsted-Lowry, una base es una sustancia capaz de:", o:["Aceptar protones (H+)", "Donar protones (H+)", "Donar electrones", "Liberar iones OH-"], c:0, e:"Brønsted-Lowry define ácidos como donadores de protones (H+) y bases como aceptores de protones."},
            {s:'quimica', q:"Reacción que libera calor hacia su entorno:", o:["Endotérmica", "Exotérmica", "Catabólica", "Isotérmica"], c:1, e:"Exo (fuera) + térmica (calor). Ejemplo: la combustión."},
            {s:'quimica', q:"Configuración electrónica correcta del Carbono (Z=6):", o:["1s² 2s² 2p¹", "1s² 2s² 2p²", "1s² 2p⁴", "1s² 2s² 2p⁶"], c:1, e:"Se acomodan 6 electrones: 2 en el 1s, 2 en el 2s, y quedan 2 para el orbital 2p."},
            {s:'quimica', q:"El enlace peptídico es característico en la estructura de:", o:["Carbohidratos", "Lípidos", "Ácidos nucleicos", "Proteínas"], c:3, e:"Une aminoácidos para formar polipéptidos y proteínas."},
            {s:'quimica', q:"Principio que establece que si se aplica estrés a un sistema en equilibrio, este se desplaza para contrarrestarlo:", o:["Ley de Hess", "Ley de Lavoisier", "Principio de Le Chatelier", "Ley de Avogadro"], c:2, e:"El principio de Le Chatelier dicta cómo los sistemas químicos reaccionan a cambios de concentración, presión o temperatura."},
            {s:'quimica', q:"Fórmula general de los alcanos:", o:["CnH2n", "CnH2n-2", "CnH2n+2", "CnHn"], c:2, e:"Son hidrocarburos saturados. Por cada carbono, hay el doble de hidrógenos más dos (CnH2n+2)."},
            {s:'quimica', q:"Elemento más electronegativo de la tabla periódica:", o:["Oxígeno", "Cloro", "Flúor", "Nitrógeno"], c:2, e:"El Flúor (arriba a la derecha, sin contar gases nobles) tiene la mayor capacidad para atraer electrones."},
            {s:'quimica', q:"pH de una solución cuya concentración de iones [H+] es 1 x 10⁻⁴ M:", o:["10", "4", "-4", "14"], c:1, e:"Fórmula: pH = -log[H+]. pH = -log(10⁻⁴) = 4."},
            {s:'quimica', q:"Gas responsable del efecto invernadero y producto de la combustión completa:", o:["Monóxido de carbono (CO)", "Dióxido de carbono (CO₂)", "Ozono (O₃)", "Clorofluorocarbono"], c:1, e:"El CO₂ se libera al quemar hidrocarburos y atrapa calor en la atmósfera."},
            {s:'quimica', q:"¿Qué tipo de enlace se presenta en la molécula de O₂?", o:["Iónico", "Covalente polar", "Covalente no polar", "Puente de hidrógeno"], c:2, e:"Al unirse dos átomos del mismo elemento, la diferencia de electronegatividad es 0, los electrones se comparten equitativamente (no polar)."},
            {s:'quimica', q:"Isótopos son átomos del mismo elemento que difieren en el número de:", o:["Protones", "Electrones", "Neutrones", "Niveles de energía"], c:2, e:"Tienen el mismo número atómico (protones) pero diferente masa debido a una cantidad variable de neutrones."},
            // -- NUEVAS QUÍMICA --
            {s:'quimica', q:"Identifica los fenómenos puramente físicos en la lista: 1. Combustión de madera, 2. Romper papel, 3. Evaporación, 4. Corrosión, 5. Cortar leña", o:["2, 3, 5", "2, 4, 5", "1, 3, 4", "1, 2, 4"], c:0, e:"En los fenómenos físicos (romper, evaporar, cortar) no se altera la estructura química interna de la materia."},
            {s:'quimica', q:"Ley que enuncia que en una reacción química la suma de la masa de los reactivos es igual a la suma de la masa de los productos:", o:["De las proporciones múltiples", "De conservación de la masa", "De los gases ideales", "De Avogadro"], c:1, e:"Postulada por Antoine Lavoisier: 'La materia no se crea ni se destruye, solo se transforma'."},
            {s:'quimica', q:"Es el cambio de estado sólido a gaseoso de manera directa, sin pasar por el líquido:", o:["Evaporación", "Licuefacción", "Condensación", "Sublimación"], c:3, e:"La sublimación ocurre en sustancias como el hielo seco o el yodo al absorber calor saltándose la fase líquida."},
            {s:'quimica', q:"¿Qué método de separación se utiliza en la industria para la obtención de licores como el vodka a partir de una mezcla de alcohol y agua?", o:["Filtración", "Evaporación", "Destilación", "Cristalización"], c:2, e:"La destilación separa líquidos miscibles basándose en sus diferentes puntos de ebullición."},
            {s:'quimica', q:"Isótopo radiactivo utilizado en el ámbito médico en radioterapias para tratar pacientes con cáncer:", o:["Yodo-131", "Plomo-212", "Carbono-11", "Cobalto-60"], c:3, e:"El Cobalto-60 emite rayos gamma de alta energía, ideales para destruir células cancerígenas y esterilización radiológica."},
            // ==========================================
            // BLOQUE DE EXPANSIÓN: QUÍMICA (Reactivos 16 al 30)
            // ==========================================
            {s:'quimica', q:"¿Cuál es el número atómico (Z) de un elemento cuya configuración electrónica termina en $3p^5$?", o:["17", "15", "35", "9"], c:0, e:"La configuración completa es $1s^2 2s^2 2p^6 3s^2 3p^5$. Sumando todos los electrones obtenemos: 2+2+6+2+5 = 17, que corresponde al elemento Cloro."},
            {s:'quimica', q:"Al combinarse un metal del grupo IA con un no metal del grupo VIIA, el tipo de enlace que se forma es principalmente:", o:["Covalente polar", "Iónico", "Covalente no polar", "Metálico"], c:1, e:"Los metales alcalinos (IA) ceden muy fácilmente su electrón de valencia a los halógenos (VIIA), formando cationes y aniones que se atraen electrostáticamente, lo cual es la definición de enlace iónico."},
            {s:'quimica', q:"De acuerdo con la teoría clásica de Arrhenius, un ácido es una sustancia que en solución acuosa:", o:["Libera iones hidróxido ($OH^-$)", "Acepta protones", "Libera iones hidrógeno ($H^+$)", "Dona pares de electrones"], c:2, e:"Arrhenius definió a los ácidos estrictamente como aquellas sustancias que se disocian en agua produciendo iones $H^+$ (protones), mientras que las bases liberan $OH^-$."},
            {s:'quimica', q:"En la ecuación balanceada: $N_2 + 3H_2 \\rightarrow 2NH_3$, ¿cuántos moles de amoniaco se producen a partir de 2 moles de nitrógeno?", o:["2 moles", "4 moles", "6 moles", "3 moles"], c:1, e:"La relación estequiométrica de la ecuación indica que 1 mol de $N_2$ produce 2 moles de $NH_3$. Por regla de tres, si se usan 2 moles de $N_2$, se producirá el doble: 4 moles de $NH_3$."},
            {s:'quimica', q:"Es la propiedad intensiva de la materia que indica la relación entre la masa de una sustancia y el volumen que ocupa:", o:["Peso", "Densidad", "Viscosidad", "Masa molar"], c:1, e:"La densidad ($d = m/v$) es una propiedad intensiva (no depende de la cantidad de materia presente) que relaciona cuánta masa hay contenida en un volumen determinado."},
            {s:'quimica', q:"Identifica el grupo funcional que caracteriza a los alcoholes en química orgánica:", o:["-COOH", "-CHO", "-OH", "-NH_2"], c:2, e:"El grupo hidroxilo (-OH) unido a un átomo de carbono es la marca distintiva de la familia de los alcoholes. El -COOH es de los ácidos carboxílicos."},
            {s:'quimica', q:"Los elementos de la tabla periódica moderna se ordenan de acuerdo con su:", o:["Masa atómica", "Electronegatividad", "Número de neutrones", "Número atómico"], c:3, e:"A diferencia de Mendeleiev (que usó la masa), Henry Moseley determinó que las propiedades de los elementos son una función periódica de sus números atómicos (Z, la cantidad de protones)."},
            {s:'quimica', q:"¿Qué tipo de reacción química representa la ecuación $CaCO_3 \\rightarrow CaO + CO_2$?", o:["Síntesis", "Sustitución simple", "Descomposición", "Doble sustitución"], c:2, e:"Es una reacción de descomposición (o análisis), donde un solo reactivo complejo se divide mediante calor en dos o más productos simples."},
            {s:'quimica', q:"Al mezclar agua y aceite se forma un sistema heterogéneo. El método físico idóneo para separar ambos líquidos es la:", o:["Decantación", "Destilación", "Filtración", "Cromatografía"], c:0, e:"La decantación permite separar líquidos inmiscibles (que no se mezclan entre sí) basándose en su diferencia de densidades usando un embudo de separación."},
            {s:'quimica', q:"El núcleo de un átomo de Sodio ($^{23}_{11}Na$) está compuesto por:", o:["11 protones y 23 neutrones", "11 protones y 12 neutrones", "12 protones y 11 neutrones", "11 electrones y 12 protones"], c:1, e:"El número inferior (Z = 11) indica los protones. El número superior (A = 23) es la masa atómica (protones + neutrones). Para sacar los neutrones restamos: $A - Z = 23 - 11 = 12$."},
            {s:'quimica', q:"Si la entalpía ($\\Delta H$) de una reacción química tiene un valor negativo, significa que el proceso es:", o:["Endotérmico", "Espontáneo", "Reversible", "Exotérmico"], c:3, e:"Un $\\Delta H < 0$ indica que la energía de los productos es menor a la de los reactivos, es decir, el sistema perdió/liberó calor hacia su entorno. Esto define a un proceso exotérmico."},
            {s:'quimica', q:"¿Cuál es la fórmula química correcta del ácido sulfúrico?", o:["$H_2SO_3$", "$H_2S$", "$H_2SO_4$", "$HSO_4$"], c:2, e:"El ácido sulfúrico se forma por la unión del anión poliatómico sulfato ($SO_4^{-2}$) y dos cationes de hidrógeno ($H^+$) para neutralizar las cargas, resultando en $H_2SO_4$."},
            {s:'quimica', q:"Es la energía mínima necesaria para arrancarle un electrón al nivel más externo de un átomo gaseoso en estado fundamental:", o:["Electronegatividad", "Afinidad electrónica", "Energía de ionización", "Radio atómico"], c:2, e:"La energía o potencial de ionización mide la dificultad que existe para quitarle un electrón a un átomo y convertirlo en un catión positivo."},
            {s:'quimica', q:"'A temperatura constante, el volumen de una masa fija de gas es inversamente proporcional a la presión que se le aplica'. Este enunciado corresponde a la Ley de:", o:["Charles", "Boyle", "Gay-Lussac", "Avogadro"], c:1, e:"La Ley de Boyle-Mariotte establece la relación matemática inversa entre presión y volumen cuando la temperatura del sistema se mantiene constante ($P_1V_1 = P_2V_2$)."},
            {s:'quimica', q:"Si una disolución cambia su pH de 3 a 5, la concentración de iones $H^+$:", o:["Disminuye 2 veces", "Aumenta 20 veces", "Disminuye 100 veces", "Aumenta 2 veces"], c:2, e:"La escala de pH es logarítmica (base 10) e inversa. Un aumento de 2 unidades de pH significa que la acidez bajó por un factor de $10^2 = 100$. La concentración de protones disminuye 100 veces."},

            // BIOLOGÍA (15)
            {s:'biologia', q:"Proceso metabólico mediante el cual se degrada la glucosa hasta piruvato generando 2 ATP netos:", o:["Ciclo de Krebs", "Glucólisis", "Cadena respiratoria", "Fermentación"], c:1, e:"La glucólisis ocurre en el citoplasma y es el primer paso tanto en respiración aerobia como anaerobia."},
            {s:'biologia', q:"En el dogma central de la biología, la transcripción consiste en:", o:["Copiar ADN a ADN", "Traducir ARN a Proteína", "Crear ARNm a partir de un molde de ADN", "Replicar ribosomas"], c:2, e:"Transcripción es 'reescribir' el código genético del ADN a ARN mensajero (ARNm) para que pueda salir del núcleo."},
            {s:'biologia', q:"Tipo de transporte celular que requiere gasto de energía (ATP):", o:["Ósmosis", "Difusión facilitada", "Transporte activo", "Difusión simple"], c:2, e:"El transporte activo mueve sustancias en contra del gradiente de concentración, por lo que necesita invertir ATP (ej. Bomba de Sodio-Potasio)."},
            {s:'biologia', q:"Postulado de Darwin y Wallace sobre la evolución:", o:["Uso y desuso de órganos", "Herencia de caracteres adquiridos", "Selección natural", "Generación espontánea"], c:2, e:"Establece que los individuos mejor adaptados a su entorno tienen más probabilidades de sobrevivir y reproducirse."},
            {s:'biologia', q:"Cruza un chícharo homocigoto dominante (AA) con un homocigoto recesivo (aa). Genotipo de la F1:", o:["100% Aa", "50% AA, 50% aa", "100% AA", "75% Aa, 25% aa"], c:0, e:"La primera generación (F1) hereda un alelo dominante 'A' y uno recesivo 'a', resultando en descendencia 100% heterocigota (Aa)."},
            {s:'biologia', q:"Base nitrogenada presente en el ARN pero ausente en el ADN:", o:["Timina", "Guanina", "Citosina", "Uracilo"], c:3, e:"En el ARN, el Uracilo (U) reemplaza a la Timina (T) uniéndose con la Adenina (A)."},
            {s:'biologia', q:"La mitosis produce ___ células hijas con ___ de cromosomas que la célula madre.", o:["4, la mitad", "2, el mismo número", "2, el doble", "4, el mismo número"], c:1, e:"Mitosis es división de células somáticas. Genera 2 células idénticas (diploides, igual número cromosómico)."},
            {s:'biologia', q:"Relación simbiótica donde un organismo se beneficia y el otro no se afecta ni beneficia:", o:["Parasitismo", "Mutualismo", "Comensalismo", "Depredación"], c:2, e:"En el comensalismo, uno gana y al otro le da igual (ej. las rémoras nadando junto al tiburón)."},
            {s:'biologia', q:"El reino que agrupa organismos procariotas (como las bacterias) es:", o:["Fungi", "Protista", "Monera", "Plantae"], c:2, e:"El Reino Monera es el único constituido exclusivamente por organismos procariotas unicelulares (sin núcleo verdadero)."},
            {s:'biologia', q:"¿Cuál es la función principal de los ribosomas?", o:["Almacenar ADN", "Digestión celular", "Síntesis de proteínas", "Producción de lípidos"], c:2, e:"Los ribosomas 'leen' el ARN mensajero y ensamblan aminoácidos para sintetizar proteínas."},
            {s:'biologia', q:"Etapa de la respiración aerobia que produce la mayor cantidad de ATP:", o:["Glucólisis", "Ciclo de Krebs", "Fase oscura", "Cadena transportadora de electrones"], c:3, e:"La cadena transportadora de electrones (junto con la quimiósmosis) genera aproximadamente 32-34 ATP por molécula de glucosa."},
            {s:'biologia', q:"Mecanismo de especiación que ocurre por aislamiento geográfico:", o:["Especiación simpátrica", "Especiación alopátrica", "Selección artificial", "Deriva génica"], c:1, e:"'Alos' significa 'otro' y 'patria' lugar. Una barrera física separa la población y evolucionan distinto."},
            {s:'biologia', q:"Organismo autotrófo base de la cadena alimenticia en ecosistemas terrestres:", o:["Consumidores primarios", "Descomponedores", "Productores", "Depredadores tope"], c:2, e:"Las plantas y otros autotrófos fotosintéticos producen la materia orgánica inicial de la red trófica."},
            {s:'biologia', q:"Componente estructural primario de la pared celular de las plantas:", o:["Quitina", "Glucógeno", "Colágeno", "Celulosa"], c:3, e:"La celulosa es un polisacárido que otorga rigidez y soporte a las paredes celulares vegetales."},
            // -- YA ESTABAN --
            {s:'biologia', q:"Científico que en 1665 acuñó el nombre de 'célula' tras observar cortes de corcho en un microscopio:", o:["Theodor Schwann", "Robert Brown", "Robert Hooke", "Charles Darwin"], c:2, e:"Robert Hooke observó cavidades en el corcho que le recordaron a las celdillas de los monjes, llamándolas 'células'."},
            {s:'biologia', q:"Postulado de la Teoría Celular que afirma que 'Toda célula proviene de otra preexistente' (Omnis cellula e cellula):", o:["Rudolf Virchow", "Louis Pasteur", "Robert Hooke", "James Watson"], c:0, e:"Virchow completó la teoría celular de Schleiden y Schwann con este crucial postulado sobre la división celular."},
            {s:'biologia', q:"Los carbohidratos, como la glucosa, son fundamentales para la vida terrestre principalmente porque:", o:["Son fáciles de conseguir en la naturaleza", "La energía de sus enlaces proporciona gran parte de la energía vital", "Son producidos por animales pluricelulares", "Poseen un sabor dulce indispensable"], c:1, e:"Los enlaces químicos de los carbohidratos se rompen durante la respiración celular para liberar energía inmediata (ATP)."},
            {s:'biologia', q:"Es considerada la molécula universal altamente almacenadora de energía (la 'moneda energética' celular):", o:["ADN", "Clorofila", "Hemoglobina", "ATP"], c:3, e:"El Trifosfato de Adenosina (ATP) transfiere la energía química necesaria para las funciones celulares."},
            {s:'biologia', q:"Órgano celular de las plantas, provisto de doble membrana, donde se lleva a cabo la fotosíntesis:", o:["Centrosomas", "Mitocondrias", "Cloroplastos", "Vacuolas"], c:2, e:"Los cloroplastos contienen clorofila, el pigmento capaz de captar la luz solar para sintetizar glucosa."},
            {s:'biologia', q:"Secuencia correcta de las fases de la división celular (Mitosis):", o:["Interfase, profase, anafase, metafase", "Profase, metafase, anafase, telofase", "Telofase, profase, anafase, metafase", "Anafase, profase, telofase, metafase"], c:1, e:"La mnemotecnia común es 'Promete Ana Tejer': Profase, Metafase, Anafase, Telofase."},
            {s:'biologia', q:"Ciertas plantas de los trópicos (epífitas) viven sobre otras de mayor altura para captar luz solar, sin causarles daño. Es un ejemplo de:", o:["Parasitismo", "Mutualismo", "Comensalismo", "Depredación"], c:2, e:"En el comensalismo, una especie se beneficia (capta más luz) y la otra no sufre daño ni beneficio significativo."},
            {s:'biologia', q:"Un insecto como la 'Mantis religiosa' que modifica su aspecto para parecerse a una rama y obtener alimento, ilustra un ejemplo de:", o:["Mutualismo", "Comensalismo", "Mimetismo", "Simbiosis obligada"], c:2, e:"El mimetismo y la coloración disimulada son adaptaciones morfológicas para el camuflaje."},
            {s:'biologia', q:"Un cerdo que alberga en su interior gusanos como el Ascaris o la Trichinella está participando en una relación de:", o:["Endoparásitos", "Mutualismo", "Ectoparásitos", "Simbiosis"], c:0, e:"Al habitar en el interior del huésped (el cerdo) y causarle daño para alimentarse, se clasifican como endoparásitos."},
            {s:'biologia', q:"Dominio taxonómico propuesto por Carl Woese que agrupa a procariotas adaptados a condiciones extremas (alta salinidad, calor térmico):", o:["Eukarya", "Archaea", "Fungi", "Monera"], c:1, e:"Las Arqueobacterias (Archaea) son organismos microscópicos distintos a las bacterias clásicas, famosos por ser extremófilos."},
            {s:'biologia', q:"En la estructura de doble hélice del ADN humano, la Adenina se une siempre por dos puentes de hidrógeno con la:", o:["Citosina", "Guanina", "Timina", "Uracilo"], c:2, e:"Según la regla de Chargaff: la Adenina se une con Timina (A-T) y la Guanina con Citosina (G-C)."},
            {s:'biologia', q:"Autor principal de la teoría de la evolución basada en la Selección Natural:", o:["Jean-Baptiste Lamarck", "Gregor Mendel", "Charles Darwin", "Thomas Morgan"], c:2, e:"Charles Darwin (junto a Wallace) propuso que el entorno ejerce presiones que seleccionan a los individuos mejor adaptados."},
            {s:'biologia', q:"Vía metabólica que ocurre en el citoplasma y degrada la glucosa en dos moléculas de piruvato sin usar oxígeno:", o:["Ciclo de Krebs", "Glucólisis", "Fosforilación oxidativa", "Ciclo de Calvin"], c:1, e:"La glucólisis es la fase inicial tanto de la respiración celular aerobia como de la fermentación anaerobia."},
            {s:'biologia', q:"¿Cuál de los siguientes NO es un postulado de la teoría celular clásica?", o:["Todos los seres vivos están formados por células", "La célula es la unidad fisiológica de la vida", "Toda célula posee un núcleo definido por membrana", "Toda célula proviene de otra preexistente"], c:2, e:"Las células procariotas (como las bacterias) NO poseen un núcleo definido por membrana, por lo tanto, no es un postulado universal."},
            {s:'biologia', q:"Nivel de organización que agrupa a un conjunto de individuos de la MISMA especie que habitan una misma área:", o:["Comunidad", "Bioma", "Ecosistema", "Población"], c:3, e:"Una población se refiere estrictamente a miembros de una misma especie interactuando en un lugar."},
            // -- NUEVAS BIOLOGÍA --
            {s:'biologia', q:"Teoría que sostiene que la vida surge mágicamente de la materia inerte:", o:["Generación espontánea", "Panspermia", "Quimiosintética", "Celular"], c:0, e:"La Generación Espontánea (abiogénesis) fue una antigua creencia de que la vida animal surgía automáticamente de desechos."},
            {s:'biologia', q:"Teoría propuesta por Lynn Margulis que explica la aparición de células eucariotas mediante la incorporación de procariontes:", o:["Sintética", "Acoplamiento", "Mutación", "Endosimbiótica"], c:3, e:"La teoría endosimbiótica propone que organelos como mitocondrias fueron alguna vez bacterias libres fagocitadas por otra célula."},
            {s:'biologia', q:"¿Cuál de las siguientes es una molécula inorgánica necesaria para la vida?", o:["ADN", "Agua", "Glucosa", "Proteína"], c:1, e:"El agua es un compuesto inorgánico (sin enlaces carbono-carbono) y es el solvente universal metabólico."},
            {s:'biologia', q:"Indica la función biológica principal de las trompas de Falopio en mamíferos:", o:["Producción de hormonas", "Lugar de fecundación", "Implantación del embrión", "Producción de óvulos"], c:1, e:"Las trompas transportan el óvulo, y es en su tercio externo donde normalmente ocurre la fecundación por el espermatozoide."},
            {s:'biologia', q:"El anabolismo es un conjunto de reacciones metabólicas que ___ moléculas complejas a partir de moléculas simples.", o:["sintetiza", "degrada", "acomoda", "simplifica"], c:0, e:"El metabolismo se divide en catabolismo (degradación) y anabolismo (síntesis o construcción, que requiere ATP)."},
            {s:'biologia', q:"Técnica de laboratorio que consiste en extender una muestra biológica sobre un portaobjetos para su análisis microscópico:", o:["Cultivo celular", "Frotis", "Centrifugación", "Cromatografía"], c:1, e:"El frotis o extendido permite separar y fijar las células en una capa delgada para teñirlas y analizarlas ópticamente."},
            // ==========================================
            // BLOQUE DE EXPANSIÓN: BIOLOGÍA (Reactivos 16 al 30)
            // ==========================================
            {s:'biologia', q:"Son las biomoléculas especializadas, responsables de almacenar y transmitir la información genética de una generación a otra:", o:["Lípidos", "Ácidos nucleicos", "Proteínas", "Carbohidratos"], c:1, e:"El ADN y el ARN (que forman la familia de los ácidos nucleicos) contienen las bases nitrogenadas que codifican todas las instrucciones de los seres vivos."},
            {s:'biologia', q:"La función principal de una enzima dentro de las rutas metabólicas es:", o:["Proporcionar energía neta al sistema", "Actuar como biocatalizador para acelerar la reacción", "Aumentar la temperatura intracelular", "Detener el desgaste de la membrana celular"], c:1, e:"Las enzimas son proteínas globulares que actúan como catalizadores biológicos. Funcionan disminuyendo la energía de activación, lo que acelera drásticamente las reacciones sin consumirse."},
            {s:'biologia', q:"Estructuras anatómicas que tienen un origen embrionario común pero que en la actualidad realizan funciones distintas (ej. brazo humano y aleta de ballena):", o:["Órganos homólogos", "Órganos análogos", "Órganos vestigiales", "Órganos convergentes"], c:0, e:"La homología anatómica es prueba de evolución divergente. A pesar de verse diferentes por adaptación al medio, su estructura ósea básica proviene del mismo ancestro."},
            {s:'biologia', q:"¿En qué región estructural de la célula eucariota se lleva a cabo el Ciclo de Krebs?", o:["Citoplasma", "Aparato de Golgi", "Matriz mitocondrial", "Membrana plasmática"], c:2, e:"Mientras que el primer paso (glucólisis) ocurre en el citoplasma, el Ciclo de Krebs (o del ácido cítrico) tiene lugar exclusivamente dentro de la matriz de las mitocondrias."},
            {s:'biologia', q:"Es un modelo ecológico compuesto por múltiples cadenas tróficas interconectadas, el cual representa el flujo real de energía en un ecosistema:", o:["Nicho ecológico", "Pirámide de biomasa", "Red alimentaria (trófica)", "Biocenosis"], c:2, e:"Las redes tróficas son modelos mucho más realistas y complejos que las cadenas lineales aisladas, ya que demuestran que un organismo suele alimentarse de múltiples fuentes."},
            {s:'biologia', q:"Según la genética mendeliana, a las formas alternativas (variantes) que puede tener un mismo gen situado en el mismo locus se les denomina:", o:["Cromátidas", "Locus", "Alelos", "Fenotipos"], c:2, e:"Un alelo es cada una de las versiones que codifican un rasgo. Por ejemplo, el gen para el color de semilla tiene un alelo para 'amarillo' y otro alelo diferente para 'verde'."},
            {s:'biologia', q:"Tipo de reproducción asexual mediante la cual un organismo unicelular se divide en dos células hijas exactamente idénticas (muy común en bacterias):", o:["Gemación", "Bipartición (Fisión binaria)", "Esporulación", "Partenogénesis"], c:1, e:"La fisión binaria o bipartición es el mecanismo de clonación natural por el cual los procariontes replican su ADN y se dividen rápidamente."},
            {s:'biologia', q:"Reino biológico compuesto por organismos eucariotas, estrictamente heterótrofos, con pared celular compuesta de quitina y que se reproducen por esporas:", o:["Plantae", "Animalia", "Protista", "Fungi"], c:3, e:"El reino Fungi (los hongos) posee estas características exclusivas, lo que llevó a separarlos de las plantas (las cuales son autótrofas y tienen pared celular de celulosa)."},
            {s:'biologia', q:"Organelo celular membranoso encargado de empaquetar, modificar y distribuir proteínas y lípidos hacia su destino final (fuera o dentro de la célula):", o:["Retículo endoplásmico liso", "Lisosoma", "Aparato de Golgi", "Ribosoma"], c:2, e:"El Aparato de Golgi funciona como el sistema de paquetería celular. Recibe vesículas del retículo, las modifica y las etiqueta para enviarlas a donde se necesiten."},
            {s:'biologia', q:"¿Cuál es el principal producto final de la fotosíntesis que la planta utiliza directamente como fuente de energía estructural y metabólica?", o:["Oxígeno ($O_2$)", "Agua ($H_2O$)", "Glucosa ($C_6H_{12}O_6$)", "Dióxido de carbono ($CO_2$)"], c:2, e:"El oxígeno es solo un gas de desecho (subproducto) de la fotosíntesis. El verdadero objetivo metabólico de la planta es sintetizar carbohidratos (glucosa) para sobrevivir."},
            {s:'biologia', q:"Células sanguíneas especializadas en el transporte masivo de oxígeno y dióxido de carbono gracias a la proteína hemoglobina:", o:["Leucocitos", "Plaquetas", "Eritrocitos (Glóbulos rojos)", "Macrófagos"], c:2, e:"Los eritrocitos carecen de núcleo y organelos en su etapa madura para maximizar el espacio disponible para almacenar moléculas de hemoglobina."},
            {s:'biologia', q:"Condición genética (aneuploidía) en la cual un individuo humano posee tres cromosomas en lugar del par normal en la posición 21:", o:["Síndrome de Turner", "Síndrome de Klinefelter", "Síndrome de Down", "Daltonismo"], c:2, e:"El Síndrome de Down es causado por una no disyunción meiótica, generando una trisomía en el cromosoma 21, dando un total de 47 cromosomas en las células somáticas."},
            {s:'biologia', q:"El ciclo biogeoquímico gaseoso en el que participan intensamente las bacterias fijadoras (como Rhizobium) que habitan en las raíces de las leguminosas es el ciclo del:", o:["Carbono", "Fósforo", "Agua", "Nitrógeno"], c:3, e:"Aunque la atmósfera es 78% nitrógeno, ni plantas ni animales pueden respirarlo. Estas bacterias lo 'fijan' transformándolo en amoniaco y nitratos asimilables para la biosfera."},
            {s:'biologia', q:"La inoculación de antígenos atenuados mediante vacunas proporciona a los humanos un tipo de inmunidad catalogada como:", o:["Activa artificial", "Activa natural", "Pasiva natural", "Pasiva artificial"], c:0, e:"Es activa porque estimula al sistema inmunológico del paciente a producir sus propios anticuerpos (memoria), y es artificial porque se induce médicamente."},
            {s:'biologia', q:"La teoría quimiosintética sobre el origen de la vida, que postula la síntesis prebiótica a partir de un caldo primitivo, fue propuesta de manera independiente por:", o:["Watson y Crick", "Oparin y Haldane", "Darwin y Wallace", "Miller y Urey"], c:1, e:"Alexander Oparin y John Haldane teorizaron en la década de 1920 que la vida surgió de reacciones químicas graduales, hipótesis que más tarde demostraron experimentalmente Miller y Urey."},

            // HISTORIA (15)
            {s:'historia', q:"Tratado que dio fin oficial a la Primera Guerra Mundial e impuso duras sanciones a Alemania:", o:["Tratado de Versalles", "Tratado de Tordesillas", "Tratado de Yalta", "Pacto de Varsovia"], c:0, e:"Firmado en 1919, desmanteló el ejército alemán e impuso deudas impagables, sentando las bases de la 2da Guerra."},
            {s:'historia', q:"Periodo de México en el que Plutarco Elías Calles controló la presidencia sin ser el presidente en turno:", o:["Porfiriato", "Reforma", "El Maximato", "Guerra Cristera"], c:2, e:"Calles se autoproclamó 'Jefe Máximo de la Revolución' y controló a tres presidentes (1928-1934)."},
            {s:'historia', q:"Causa inmediata del inicio de la Segunda Guerra Mundial en 1939:", o:["Asesinato del Archiduque Francisco Fernando", "Bombardeo a Pearl Harbor", "Invasión de Alemania a Polonia", "Guerra Civil Española"], c:2, e:"La invasión de Polonia (1 septiembre 1939) provocó que Francia y Gran Bretaña declararan la guerra a la Alemania nazi."},
            {s:'historia', q:"Documento firmado por Santa Anna donde reconocía la independencia de Texas:", o:["Tratados de Córdoba", "Tratados de Velasco", "Tratado de Guadalupe Hidalgo", "Plan de Iguala"], c:1, e:"Firmados en 1836 tras ser capturado en la batalla de San Jacinto."},
            {s:'historia', q:"Presidente que promulgó las Leyes de Reforma (separación Iglesia-Estado):", o:["Benito Juárez", "Sebastián Lerdo de Tejada", "Ignacio Comonfort", "Porfirio Díaz"], c:0, e:"Benito Juárez fue el principal impulsor de estas leyes durante la Guerra de Reforma."},
            {s:'historia', q:"Acontecimiento que marca el inicio de la Edad Contemporánea:", o:["Caída de Constantinopla", "Revolución Rusa", "Revolución Francesa", "Descubrimiento de América"], c:2, e:"La Revolución Francesa (1789) rompe con el Antiguo Régimen, inaugurando la Edad Contemporánea."},
            {s:'historia', q:"Bloque militar creado durante la Guerra Fría para contrarrestar a la OTAN:", o:["ONU", "Liga de las Naciones", "Triple Entente", "Pacto de Varsovia"], c:3, e:"Fue una alianza militar de los países del bloque socialista (liderado por la URSS) en respuesta a la OTAN (capitalistas)."},
            {s:'historia', q:"Plan mediante el cual Francisco I. Madero llamó a levantarse en armas contra Porfirio Díaz:", o:["Plan de Ayala", "Plan de San Luis", "Plan de Guadalupe", "Plan de Tuxtepec"], c:1, e:"Promulgado en 1910, convocó al levantamiento armado el 20 de noviembre de ese año."},
            {s:'historia', q:"Imperio mesoamericano que cayó ante los españoles el 13 de agosto de 1521:", o:["Maya", "Tolteca", "Inca", "Mexica (Azteca)"], c:3, e:"La caída de Tenochtitlán marcó la derrota del Imperio Mexica y el inicio de la época colonial."},
            {s:'historia', q:"Líder de la Revolución Bolchevique que instauró el régimen comunista en Rusia:", o:["Iósif Stalin", "Vladímir Lenin", "León Trotsky", "Zar Nicolás II"], c:1, e:"Lenin lideró el golpe de Estado en octubre de 1917, estableciendo el primer estado socialista del mundo."},
            {s:'historia', q:"Presidente de México que nacionalizó la industria petrolera el 18 de marzo de 1938:", o:["Álvaro Obregón", "Lázaro Cárdenas", "Manuel Ávila Camacho", "Miguel Alemán"], c:1, e:"El General Lázaro Cárdenas expropió el petróleo a las compañías extranjeras tras un conflicto laboral."},
            {s:'historia', q:"El 'Crack del 29' fue una profunda crisis económica iniciada en:", o:["Alemania", "Inglaterra", "Rusia", "Estados Unidos"], c:3, e:"La caída de la bolsa de Wall Street en Nueva York desató la Gran Depresión mundial."},
            {s:'historia', q:"Guerra que México enfrentó por el impago de su deuda externa con Francia (1862-1867):", o:["Guerra de los Pasteles", "Guerra de Castas", "Segunda Intervención Francesa", "Guerra Cristera"], c:2, e:"Resultó en el efímero Segundo Imperio Mexicano bajo el mando de Maximiliano de Habsburgo."},
            {s:'historia', q:"Movimiento filosófico del siglo XVIII que impulsó el uso de la razón y el conocimiento científico:", o:["Renacimiento", "Romanticismo", "La Ilustración", "Positivismo"], c:2, e:"La Ilustración, o 'Siglo de las Luces', cuestionó el poder monárquico y religioso, fundamentando las revoluciones burguesas."},
            {s:'historia', q:"Etapa de tensión política mundial donde hubo carrera armamentista y conquista espacial sin enfrentamiento bélico directo:", o:["Paz Armada", "Guerra Fría", "Imperialismo", "Guerra de los Balcanes"], c:1, e:"La Guerra Fría (1947-1991) enfrentó indirectamente al bloque capitalista y comunista en escenarios periféricos y tecnológicos."},
            // -- NUEVAS HISTORIA --
            {s:'historia', q:"El Tratado de Londres de 1861, firmado por Inglaterra, Francia y España tenía como objetivo:", o:["Ofrecer el trono de México a Maximiliano", "Presionar a Juárez para retirar la moratoria al pago de deuda externa", "Decretar una monarquía católica", "Evitar invasiones estadounidenses"], c:1, e:"Juárez suspendió el pago de la deuda. Estas potencias se aliaron para exigir el pago (derivando en la Intervención Francesa)."},
            {s:'historia', q:"Una de las principales causas ocultas que provocaron la Segunda Intervención Francesa a México fue:", o:["La liquidación de la deuda externa", "La anexión de Texas a EE.UU.", "El interés imperialista de Francia en América", "La oposición a los conservadores"], c:2, e:"Más allá de la deuda, Napoleón III buscaba frenar a Estados Unidos y establecer una zona de influencia francesa en América."},
            {s:'historia', q:"¿Cuál fue el objetivo central de la Conferencia de Berlín (1884-1885)?", o:["El libre comercio en América", "Firmar la paz de Napoleón", "Crear la Sociedad de Naciones", "Organizar el reparto colonial de África entre potencias"], c:3, e:"Para evitar conflictos bélicos entre las potencias imperialistas, se sentaron a dividirse el continente africano con mapa en mano."},
            {s:'historia', q:"Ordena cronológicamente: I. Expropiación Petrolera, II. Matanza de Tlatelolco, III. Inicio de la Revolución Mexicana, IV. Constitución actual.", o:["III, IV, I, II", "IV, III, II, I", "III, I, IV, II", "I, III, IV, II"], c:0, e:"Revolución (1910) -> Constitución (1917) -> Expropiación Petrolera (1938) -> Tlatelolco (1968)."},
            {s:'historia', q:"La política de reformas conocida como Perestroika y Glasnost fue la principal causa interna de:", o:["El éxito del modelo económico chino", "La desintegración de la Unión Soviética (URSS)", "La invasión de Estados Unidos", "La creación del Muro de Berlín"], c:1, e:"Gorbachov buscaba reestructurar la economía (Perestroika) y dar transparencia (Glasnost), pero aceleraron el colapso soviético."},

             // GEOGRAFÍA 
            {s:'geografia', q:"¿Qué país se formó en Europa tras la violenta desintegración de Yugoslavia en la década de los 90?", o:["Ucrania", "Croacia", "Polonia", "Checoslovaquia"], c:1, e:"Yugoslavia se fragmentó en varios países: Croacia, Serbia, Eslovenia, Bosnia, Macedonia y Montenegro."},
            {s:'geografia', q:"Las costas de los estados de Tamaulipas, Veracruz y Tabasco son bañadas por las aguas de:", o:["El Océano Pacífico", "El Mar Caribe", "El Golfo de México", "El Golfo de California"], c:2, e:"Estos estados conforman la principal llanura costera del oriente de México hacia el Golfo de México."},
            {s:'geografia', q:"Tipo de clima predominante en la Península de Yucatán, de acuerdo con el sistema de Köppen:", o:["Seco desértico", "Templado con lluvias en invierno", "Cálido subhúmedo con lluvias en verano", "Polar de Tundra"], c:2, e:"La península es tropical, cálida y recibe fuertes lluvias durante el verano y el paso de huracanes."},
            {s:'geografia', q:"Río que sirve como límite natural en la frontera sur entre México y Belice:", o:["Río Usumacinta", "Río Bravo", "Río Hondo", "Río Suchiate"], c:2, e:"El río Hondo define la frontera con Belice, mientras que el Suchiate y el Usumacinta lo hacen con Guatemala."},
            {s:'geografia', q:"Actividad económica principal que se desarrolla en la sonda de Campeche y Tabasco:", o:["Agricultura de exportación", "Pesca comercial", "Extracción petrolera", "Turismo ecológico"], c:2, e:"Esta zona marina es la región petrolera más importante y productiva de México (ej. Complejo Cantarell)."},
            {s:'geografia', q:"Placas tectónicas responsables de la alta sismicidad en la costa sur y centro de México:", o:["Placa del Pacífico y Nazca", "Placa de Cocos y Norteamericana", "Placa del Caribe y Cocos", "Placa Norteamericana y Euroasiática"], c:1, e:"La placa de Cocos (oceánica) subduce por debajo de la placa Norteamericana (continental), generando los sismos en México."},
            {s:'geografia', q:"Mineral metálico del cual México ha sido históricamente el primer productor a nivel mundial:", o:["Oro", "Cobre", "Plata", "Hierro"], c:2, e:"Zacatecas, Chihuahua y Durango mantienen a México como líder mundial en producción de plata."},
            {s:'geografia', q:"Proyección cartográfica cilíndrica que conserva las formas pero distorsiona enormemente el tamaño hacia los polos:", o:["Proyección de Peters", "Proyección de Mercator", "Proyección Cónica", "Proyección Azimutal"], c:1, e:"Diseñada en 1569 para la navegación. Hace que Groenlandia parezca del tamaño de África (cuando es 14 veces más pequeña)."},
            {s:'geografia', q:"País con la mayor población absoluta del mundo en la actualidad:", o:["Estados Unidos", "China", "India", "Rusia"], c:2, e:"Recientemente, India superó a China como el país más poblado del planeta con más de 1,400 millones de habitantes."},
            {s:'geografia', q:"Movimiento de la Tierra que, combinado con la inclinación del eje terrestre, origina las estaciones del año:", o:["Rotación", "Nutación", "Traslación", "Precesión"], c:2, e:"La traslación (órbita alrededor del sol en 365 días) expone a los hemisferios a diferente radiación según la época del año."},
            {s:'geografia', q:"Continente que presenta la mayor tasa de crecimiento demográfico y natalidad del mundo:", o:["Asia", "América Latina", "África", "Oceanía"], c:2, e:"África tiene la población más joven y las tasas de fecundidad más altas del planeta."},
            {s:'geografia', q:"Organización y tratado internacional vigente para el libre comercio entre México, EE.UU. y Canadá:", o:["TLCAN (NAFTA)", "T-MEC", "Mercosur", "Alianza del Pacífico"], c:1, e:"El Tratado entre México, Estados Unidos y Canadá (T-MEC) reemplazó al antiguo TLCAN en 2020."},
            {s:'geografia', q:"Estado de la República Mexicana caracterizado por tener la mayor diversidad lingüística, cultural y biológica:", o:["Chiapas", "Yucatán", "Michoacán", "Oaxaca"], c:3, e:"Oaxaca es el estado con mayor número de etnias (zapotecos, mixtecos, etc.) y una orografía que fomenta gran biodiversidad."},
            {s:'geografia', q:"La cordillera de los Andes, la más larga del mundo, se localiza en:", o:["América del Sur", "Asia Central", "Norteamérica", "Europa Oriental"], c:0, e:"Recorre toda la costa occidental de Sudamérica, atravesando países como Chile, Perú, Ecuador y Colombia."},
            {s:'geografia', q:"Fenómeno climático que causa un calentamiento anómalo en las aguas del Océano Pacífico Ecuatorial, alterando el clima global:", o:["Efecto Invernadero", "La Niña", "El Niño", "Cambio Climático"], c:2, e:"El Niño (ENSO) calienta el Pacífico, causando sequías en unas regiones e inundaciones severas en otras."},
            // ==========================================
            // BLOQUE DE EXPANSIÓN: GEOGRAFÍA (Imágenes + 5 Extras)
            // ==========================================
            {s:'geografia', q:"La placa tectónica de mayor extensión en el planeta es la:", o:["Pacífica", "Africana", "Americana", "Antártica"], c:0, e:"La placa del Pacífico es la placa oceánica más inmensa de la Tierra, abarcando casi toda la cuenca del Océano Pacífico y formando el Cinturón de Fuego."},
            {s:'geografia', q:"El accidente geográfico conocido como Falla de San Andrés está causando la separación paulatina del estado de:", o:["Baja California", "Sonora", "Los Ángeles", "Sinaloa"], c:0, e:"La falla de San Andrés es una falla transformante (deslizamiento lateral) que está separando lentamente la península de Baja California del resto del continente americano."},
            {s:'geografia', q:"La dinámica convectiva del manto superior origina que en la superficie terrestre se formen: 1. Volcanes, 2. Montañas, 3. Grutas, 4. Cuencas, 5. Islas", o:["1, 3, 4", "1, 2, 5", "2, 3, 4", "3, 4, 5"], c:1, e:"Las corrientes del manto mueven la litosfera provocando vulcanismo (1), levantamiento de cordilleras o montañas (2) y la creación de arcos de islas (5) por subducción."},
            {s:'geografia', q:"Las placas tectónicas ubicadas al occidente de América provocan principalmente:", o:["Actividad volcánica", "Modificaciones en el relieve", "Fallas geográficas", "Actividad sísmica"], c:3, e:"El choque constante (subducción) de las placas oceánicas contra la placa Americana en la costa del Pacífico es el responsable de la alta y continua actividad sísmica."},
            {s:'geografia', q:"En las regiones de meseta se presentan características económicas y demográficas como:", o:["Ganadería extensiva y densidad media de población", "Agricultura de plantación y densidad baja", "Extracción minera metálica y densidad baja", "Explotación forestal y densidad media"], c:0, e:"Las mesetas o altiplanicies tienen relieves planos y clima moderado por la altitud, condiciones idóneas para el pastoreo (ganadería) y que sostienen a una población media."},
            {s:'geografia', q:"La cordillera de los Andes, la más extensa de Sudamérica, se localiza abarcando territorios como:", o:["Costa Rica y El Salvador", "Cuba y Haití", "Argentina y Brasil", "Chile y Perú"], c:3, e:"Los Andes recorren toda la espina dorsal del occidente sudamericano, atravesando fuertemente a países como Chile, Perú, Ecuador, Bolivia y Colombia."},
            {s:'geografia', q:"Identifica los sistemas montañosos en América, Europa y Asia (I, II y III correspondientemente):", o:["Sierra Nevada; Apeninos; Zagros", "Altiplanicie; Balcanes; Himalaya", "Sierras madre; Cárpatos; Urales", "Rocosas; Alpes; Cáucaso"], c:3, e:"El sistema I (Norteamérica) son las Montañas Rocosas; el II (Centro de Europa) son los Alpes; y el III (Frontera Europa-Asia) es la cordillera del Cáucaso."},
            {s:'geografia', q:"Los estados de la república mexicana que concentran históricamente la actividad minera de oro, plata y plomo son:", o:["Sonora, Coahuila y Chihuahua", "Sonora, Nuevo León y Guerrero", "Zacatecas, San Luis Potosí y Puebla", "Coahuila, Morelos y Zacatecas"], c:0, e:"El norte del país (Sonora, Chihuahua, Coahuila, junto con Zacatecas) domina la extracción metalúrgica gracias a las ricas vetas de la Sierra Madre Occidental y Oriental."},
            {s:'geografia', q:"Mineral no metálico que se encuentra en la zona volcánica de Veracruz y sirve para hacer explosivos:", o:["Azufre", "Plomo", "Selenio", "Cadmio"], c:0, e:"En zonas de alta actividad volcánica antigua o reciente (como la región de Los Tuxtlas o el Pico de Orizaba), se deposita gran cantidad de azufre, ingrediente clave de la pólvora."},
            {s:'geografia', q:"Estados costeros de México con la mayor producción petrolera a nivel nacional:", o:["Tlaxcala, Veracruz y Colima", "Campeche, Tabasco y Veracruz", "Sonora, Oaxaca y Veracruz", "Colima, Tabasco y Yucatán"], c:1, e:"La costa del Golfo de México, específicamente la Sonda de Campeche y los litorales de Tabasco y Veracruz, extraen la inmensa mayoría de los hidrocarburos del país."},
            {s:'geografia', q:"Fase del ciclo del agua que abastece directamente de agua dulce a las regiones continentales:", o:["Condensación", "Infiltración", "Licuefacción", "Precipitación"], c:3, e:"La precipitación (lluvia, nieve o granizo) es el mecanismo por el cual la humedad condensada cae a los continentes, recargando ríos, lagos y acuíferos."},
            {s:'geografia', q:"Sector económico en el que las aguas continentales (ríos, lagos) son absolutamente fundamentales:", o:["Secundarias", "Terciarias", "Primarias", "Cuaternarias"], c:2, e:"Las actividades primarias (agricultura, ganadería y silvicultura) son las que más dependen de la disponibilidad de agua dulce para el riego y subsistencia animal."},
            {s:'geografia', q:"La cuenca de los ríos Azul (Yangtsé) y Amarillo (Huang He) en Asia presentan características de:", o:["Población media y actividades industriales", "Población baja y actividades secundarias", "Población alta y actividades agrícolas", "Población media y actividades agrícolas"], c:2, e:"Históricamente, estos ríos fertilizan inmensas llanuras en China que sostienen a una enorme población humana (alta) mediante una intensiva producción agrícola milenaria."},
            {s:'geografia', q:"Las mayores reservas de agua dulce en nuestro planeta están representadas por:", o:["Los ríos", "Las aguas superficiales", "Las aguas subterráneas", "Los glaciares"], c:3, e:"Aproximadamente el 68% de toda el agua dulce del planeta se encuentra congelada y atrapada en los glaciares y casquetes polares (como la Antártida y Groenlandia)."},
            {s:'geografia', q:"Corrientes marinas que favorecen enormemente la actividad pesquera al crear bancos de nutrientes:", o:["Cálidas y frías (al converger)", "Frías y superficiales", "Frías y convergentes", "Cálidas y profundas"], c:0, e:"El choque o encuentro de corrientes frías (ricas en plancton y nutrientes) con corrientes cálidas genera las zonas pesqueras más productivas del mundo."},
            {s:'geografia', q:"Las corrientes marinas frente a las costas de Japón favorecen espectacularmente el desarrollo de:", o:["La actividad pesquera", "El transporte marítimo", "El comercio internacional", "La protección de puertos"], c:0, e:"Frente a Japón chocan la corriente fría de Oyashio y la cálida de Kuroshio. Este choque térmico y nutritivo convierte al archipiélago en una potencia pesquera."},
            {s:'geografia', q:"La región natural que presenta un clima tropical con lluvias torrenciales todo el año corresponde a la _____ y se ubica entre los sitios de _____.", o:["Selva – la cuenca del Amazonas", "Sabana – sureste de México", "Tundra – norte de Canadá", "Pradera – cuenca del Mississippi"], c:0, e:"El clima ecuatorial (Af) propicia la formación de la selva tropical lluviosa, siendo la enorme cuenca del río Amazonas el ejemplo más representativo del mundo."},
            {s:'geografia', q:"En la región natural de pradera se presentan ______ y se fomenta intensamente el cultivo de ______.", o:["Lluvias en verano – cereales", "Lluvias todo el año – frutos", "Lluvias en invierno – la vid", "Lluvias escasas – cereales"], c:0, e:"Las praderas tienen clima templado con lluvias en verano. Sus extensas llanuras y suelos profundos son idóneos para cultivar cereales como trigo, maíz y avena."},
            {s:'geografia', q:"Factores geográficos principales que favorecen la concentración de la población en el mundo:", o:["El clima de tundra y la presencia de ríos", "El clima templado y la baja altitud del terreno", "El clima polar y la presencia de minerales", "El clima tropical y la vegetación de coníferas"], c:1, e:"Las llanuras (baja altitud) y los climas templados facilitan las comunicaciones, la agricultura y el confort humano, aglomerando a la mayor parte de la población."},
            {s:'geografia', q:"Las zonas de 'vacíos de población' ubicadas en las zonas latitudinales altas (cerca de los polos) tienen temperaturas:", o:["Templadas", "Tropicales", "Extremosas", "Frías"], c:3, e:"Las altas latitudes reciben muy poca radiación solar. El frío intenso, hielo perenne y la imposibilidad de hacer agricultura hacen que estén prácticamente deshabitadas."},
            {s:'geografia', q:"Estado de la República Mexicana históricamente más afectado por el impacto de ciclones tropicales:", o:["Oaxaca", "Nayarit", "Yucatán", "Tamaulipas"], c:2, e:"Por su ubicación expuesta entrando al Golfo de México y Mar Caribe, además de su relieve plano sin montañas que frenen los vientos, Yucatán es golpeado fuertemente por huracanes."},
            {s:'geografia', q:"Durante la 'canícula' de agosto, en el norte del territorio nacional los ganaderos se enfrentan gravemente al problema de:", o:["Disminución de los créditos", "Temporada de sequía que acaba con el ganado", "Endurecimiento de suelos agrícolas", "Disminución de la producción de aguacates"], c:1, e:"La canícula es el periodo más caluroso y seco del año. En el árido norte de México, esta sequía agota los abrevaderos y pastizales, matando al ganado por deshidratación e inanición."},
            {s:'geografia', q:"El aumento y retención del bióxido de carbono ($CO_2$) en la parte inferior de la atmósfera está generando:", o:["El cambio global del agua", "El cambio climático global", "La alteración del viento", "La modificación del relieve"], c:1, e:"El $CO_2$ es un gas de efecto invernadero que atrapa el calor solar en la troposfera. Su exceso por quema de combustibles causa calentamiento y altera los patrones climáticos globales."},
            {s:'geografia', q:"Los gases clorofluorocarbonos (CFC) producidos por el hombre, utilizados en aerosoles y refrigerantes, provocan en la atmósfera:", o:["La lluvia ácida", "La reducción de la capa de ozono", "La inversión térmica", "El cambio climático global"], c:1, e:"Los CFC reaccionan químicamente con el ozono ($O_3$) en la estratosfera, destruyéndolo y dejando pasar la peligrosa radiación ultravioleta del sol."},
            {s:'geografia', q:"La degradación de los suelos secos, áridos y semi-húmedos por efecto de variaciones del clima y la actividad humana destructiva se llama:", o:["Desertificación", "Erosión", "Deforestación", "Sodificación"], c:0, e:"La desertificación es el avance destructivo del desierto sobre tierras que antes eran productivas, causado frecuentemente por sobrepastoreo y tala extrema en ecosistemas frágiles."},
            {s:'geografia', q:"Principal indicador socioeconómico que se utiliza para medir el valor monetario total de los bienes y servicios producidos por un país en un año:", o:["Producto Interno Bruto (PIB)", "Ingreso Per Cápita", "Índice de Desarrollo Humano (IDH)", "Tasa de Natalidad"], c:0, e:"El PIB es la herramienta macroeconómica clásica que mide la riqueza generada por una nación dentro de sus fronteras durante un periodo determinado."},
            {s:'geografia', q:"En México, la región geoeconómica que concentra la mayor actividad industrial, financiera y densidad de población es:", o:["La Península de Yucatán", "El Noroeste", "El Sur-Sureste", "El Centro de México"], c:3, e:"El centro del país (conformado por la CDMX y el Estado de México) es el núcleo histórico de los poderes, la industria de transformación y concentra a millones de habitantes."},
            {s:'geografia', q:"La formación de la gigantesca cordillera del Himalaya es el resultado de la convergencia (choque) de las placas tectónicas:", o:["Euroasiática e Indoaustraliana", "Pacífica y Norteamericana", "Sudamericana y de Nazca", "Africana y Euroasiática"], c:0, e:"La colisión masiva entre la placa Indoaustraliana (India) incrustándose contra la placa Euroasiática hace millones de años arrugó la litosfera formando los picos más altos del mundo."},
            {s:'geografia', q:"Rama de la geografía física que se encarga del estudio de la distribución, propiedades y dinámicas de las aguas continentales y oceánicas:", o:["Orografía", "Climatología", "Hidrografía", "Geomorfología"], c:2, e:"La hidrografía (del griego 'hydros' agua) mapea y estudia los océanos, ríos, lagos, glaciares y aguas subterráneas del planeta."},
            {s:'geografia', q:"La principal zona pesquera de México, caracterizada por las aguas frías y la enorme captura comercial de atún y sardina, se localiza en:", o:["El Golfo de México", "El Mar Caribe", "El Pacífico Norte y Golfo de California", "El Golfo de Tehuantepec"], c:2, e:"El noroeste de México (costas de Baja California, Sonora y Sinaloa) tiene corrientes oceánicas frías ricas en nutrientes, siendo el líder indiscutible en tonelaje pesquero nacional."},
            
            // COMPRENSIÓN ESCRITA (ESPAÑOL) (15)
            {s:'escrita', q:"Identifica la oración con concordancia correcta:", o:["Hubieron muchas personas en la fiesta.", "Hubo muchas personas en la fiesta.", "Habían varias personas en la fiesta.", "Han habidos personas en la fiesta."], c:1, e:"El verbo 'haber' es impersonal cuando indica existencia; siempre se conjuga en tercera persona singular (hubo, había)."},
            {s:'escrita', q:"Función de la lengua que busca convencer, persuadir o influir en el receptor:", o:["Función referencial", "Función poética", "Función fática", "Función apelativa"], c:3, e:"La función apelativa o conativa se centra en el receptor, usada comúnmente en discursos políticos y publicidad."},
            {s:'escrita', q:"Elige el nexo coordinante adversativo en la oración: 'Estudió mucho, ___ no aprobó el examen'.", o:["porque", "así que", "pero", "y"], c:2, e:"Los nexos adversativos oponen ideas (pero, mas, sin embargo, sino)."},
            {s:'escrita', q:"¿Cuál de las siguientes palabras es ESDRÚJULA y debe llevar tilde?", o:["Examen", "Volumen", "Critico (verbo criticar)", "Cómputo"], c:3, e:"Las esdrújulas se acentúan en la antepenúltima sílaba y SIEMPRE llevan tilde. 'Examen' y 'volumen' son llanas terminadas en 'n', no llevan tilde."},
            {s:'escrita', q:"Vicio del lenguaje que consiste en el empleo de vocablos innecesarios (redundancia):", o:["Solecismo", "Barbarismo", "Pleonasmo", "Cacofonía"], c:2, e:"Ejemplo de pleonasmo: 'subir para arriba', 'lapso de tiempo', 'verlo con mis propios ojos'."},
            {s:'escrita', q:"En la oración 'La niña compró dulces para su hermano', el objeto indirecto es:", o:["La niña", "compró", "dulces", "para su hermano"], c:3, e:"El Objeto Indirecto responde a la pregunta '¿Para quién?' o '¿A quién?' se realiza la acción."},
            {s:'escrita', q:"Indica el par de palabras homófonas correctas para: 'Espero que él ___ a la casa y salte la ___'.", o:["vaya / vaya", "valla / vaya", "vaya / valla", "valla / valla"], c:2, e:"'Vaya' es del verbo ir (espero que vaya). 'Valla' es una cerca u obstáculo."},
            {s:'escrita', q:"Elige la oración donde se usa correctamente el acento diacrítico:", o:["El me dijo que sí vendría.", "Té sirvo más café.", "Sé más cuidadoso con tú mochila.", "Aún no ha llegado el profesor."], c:3, e:"'Aún' lleva tilde cuando equivale a 'todavía'. 'Él' lleva tilde como pronombre, 'té' como bebida, 'tú' como pronombre, 'sé' del verbo ser/saber."},
            {s:'escrita', q:"Sinónimo de la palabra 'Efímero':", o:["Duradero", "Fugaz", "Eterno", "Frecuente"], c:1, e:"Efímero significa que dura muy poco tiempo, por lo tanto 'fugaz' es su sinónimo directo."},
            {s:'escrita', q:"Sujeto morfológico (tácito) de la oración: 'Llegamos tarde al concierto'.", o:["El concierto", "Tarde", "Nosotros", "Ellos"], c:2, e:"El sujeto no está escrito, pero la terminación del verbo (llegamos) indica que el sujeto implícito es 'nosotros'."},
            {s:'escrita', q:"'Su rostro era de porcelana' es un ejemplo de la figura retórica llamada:", o:["Metáfora", "Símil", "Hipérbaton", "Paradoja"], c:0, e:"Sustituye un término real por uno imaginario por relación de semejanza, sin usar palabras comparativas como 'cual' o 'como'."},
            {s:'escrita', q:"Forma del discurso que relata hechos reales o ficticios en una línea temporal:", o:["Argumentativo", "Descriptivo", "Narrativo", "Expositivo"], c:2, e:"La narrativa cuenta sucesos en el tiempo (inicio, clímax, desenlace)."},
            {s:'escrita', q:"Uso correcto de letras (s, c, z): La mujer tomó una ___ de café y salió de ___.", o:["taza / caza", "tasa / casa", "taza / casa", "tasa / caza"], c:2, e:"Taza (recipiente para beber). Casa (vivienda). (Tasa es índice/impuesto, Caza es atrapar animales)."},
            {s:'escrita', q:"¿Cuál de estas oraciones es compuesta coordinada copulativa?", o:["Te llamé pero no respondiste.", "Iré al cine y comeré palomitas.", "Estudias o trabajas.", "Dijo que vendría pronto."], c:1, e:"Las copulativas unen información sumando elementos usando los nexos: y, e, ni."},
